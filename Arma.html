<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Chela One", cursive;}
.wrapper {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    transform: scale(1.05);
    transform-origin: top center;
    margin-bottom: 40px;
}
/* Arma 主題色導航列 (冷灰金調) */
.raid-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.raid-nav a {
    color: #dcd6cd;
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 1px;
    padding: 6px 20px;
    border-radius: 8px;
    background: #141619;
    border: 1px solid #3a3f47;
    transition: all 0.25s ease;
}
.raid-nav a:hover {
    color: #f3e5ab;
    border-color: #d4af37;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.25);
}
.raid-nav a.active {
    color: #16181a;
    background: #d4af37;
    border-color: #f3e5ab;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
}

.three-panel {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 16px;
    margin-bottom: 16px;
    justify-content: center;
}
.panel {
    background: radial-gradient(circle at 50% 15%, #1f2124 0%, #0d0e10 75%) !important;
    border: 2px solid #8c929a;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 6px rgba(140, 146, 154, 0.2), inset 0 0 4px rgba(212, 175, 55, 0.08);
    width: 244px;
    box-sizing: border-box;
    position: relative;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.panel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    pointer-events: none;
}

.row-item {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 10px;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
}
.row-item:last-child { margin-bottom: 0; }
.icon-wrap { display: flex; gap: 4px; width: 44px; height: 44px; align-items: center; justify-content: center; }
.icon-slot { flex-shrink: 0; width: 44px; height: 44px; }
.icon-slot img {
    width: 44px; height: 44px; object-fit: contain; display: block;
    transition: transform 0.2s ease, filter 0.2s ease;
}
.icon-slot img:hover { transform: scale(1.08); filter: drop-shadow(0 0 5px #d4af3788); }

.screenshot-area{ background-color:#0d0e10 !important; padding: 20px; border-radius: 16px; }
.header{ text-align:center; margin-bottom:20px; }
.header-title-row {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 12px 0 18px 0;
}
.header-title-row::before, .header-title-row::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37 30%, #d4af37 70%, transparent);
    opacity: 0.4; box-shadow: 0 0 4px rgba(212, 175, 55, 0.3);
}
.header h1 {
    font-size: 48px; color: #d4af37; font-family: "Kavoon", cursive; letter-spacing: 6px; position: relative;
    text-shadow: 2px 0 #f3e5ab, -2px 0 #2c2f35, 0 0 5px rgba(212, 175, 55, 0.4), 0 0 10px rgba(212, 175, 55, 0.2);
    animation: neonPulseHeader 2s ease-in-out infinite alternate;
}
.header h1::before, .header h1::after {
    content: ""; position: absolute; top: 50%; width: 8px; height: 8px; background: #d4af37; transform: translateY(-50%); box-shadow: 0 0 6px #d4af37;
}
.header h1::before { left: -18px; }
.header h1::after { right: -18px; }

@keyframes neonPulseHeader {
    0% { text-shadow: 2px 0 #f3e5ab, -2px 0 #2c2f35, 0 0 4px rgba(212, 175, 55, 0.4), 0 0 8px rgba(212, 175, 55, 0.2); }
    100% { text-shadow: 2px 0 #f3e5ab, -2px 0 #2c2f35, 0 0 6px rgba(212, 175, 55, 0.6), 0 0 12px rgba(212, 175, 55, 0.3); }
}
@keyframes neonPulse {
    0% { text-shadow: 2px 0 #d4af37, -2px 0 #2c2f35, 0 0 4px rgba(140, 146, 154, 0.3), 0 0 8px rgba(212, 175, 55, 0.1); }
    100% { text-shadow: 2px 0 #d4af37, -2px 0 #2c2f35, 0 0 5px rgba(140, 146, 154, 0.5), 0 0 10px rgba(212, 175, 55, 0.2); }
}

.header-info-bar{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px; font-size:20px; color:#d4af37; }
.header-info-bar span { letter-spacing: 1px; }
.header-info-bar .input-slot{
    width:80px; height:36px; background:#16181a; border:1px solid #8c929a; border-radius:6px; padding:0 12px;
    color:#ffffff; font-family:"Chela One", cursive; font-size:22px; text-align:center; outline:none; display:flex; align-items:center; justify-content:center; transition: all 0.25s ease;
}
.header-info-bar .input-slot.narrow{ width:40px; }
.header-info-bar .input-slot.spot-wide{ width:110px; }
.header-info-bar .input-slot:focus{ 
    outline:none; border-color:#d4af37; box-shadow: 0 0 6px rgba(212, 175, 55, 0.3), inset 0 0 4px rgba(140, 146, 154, 0.2); 
}

.panel-title {
    font-size: 24px; color: #d4af37; margin-bottom: 14px; text-shadow: 0 0 4px rgba(212, 175, 55, 0.4); display: flex; align-items: center; gap: 8px;
}
.panel-title::before { content: ""; display: inline-block; width: 4px; height: 18px; background: #8c929a; box-shadow: 0 0 4px #8c929a; }

.input-slot {
    background: #16181a; border: 1px solid #8c929a; border-radius: 6px; padding: 0 10px; height: 38px; width: 146px !important; 
    color: #ffffff; font-family: "Chela One", cursive; font-size: 20px; display: flex; align-items: center; transition: all 0.25s ease;
}
.input-slot:focus { outline: none; border-color:#d4af37; box-shadow: 0 0 6px rgba(212, 175, 55, 0.3), inset 0 0 4px rgba(140, 146, 154, 0.2); }

.wide-top-panel {
    background: radial-gradient(circle at 50% 15%, #1f2124 0%, #0d0e10 75%) !important;
    border: 2px solid #8c929a; border-radius: 14px; padding: 14px;
    box-shadow: 0 0 6px rgba(140, 146, 154, 0.2), inset 0 0 4px rgba(212, 175, 55, 0.08);
    width: 504px; max-width: 100%; margin: 0 auto 16px auto; animation: neonPulse 2s ease-in-out infinite alternate; position: relative;
}
.wide-top-panel::after { content: ""; position: absolute; inset: 0; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.03); pointer-events: none; }
.wide-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.wide-column { display: flex; flex-direction: column; gap: 10px; }
.wide-item { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.wide-item:last-child { margin-bottom: 0; }

.lever-panel-grid { display: flex; flex-direction: column; gap: 10px; }
.lever-custom-item { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.lever-content-wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.lever-custom-item .lever-text { font-family: "Chela One", cursive; font-size: 20px; color: #d4af37; white-space: nowrap; text-shadow: 0 0 4px rgba(212, 175, 55, 0.4); }
.lever-custom-item .input-slot { width: 146px !important; }

.bottom-bar {
    display: flex; gap: 16px; justify-content: center; align-items: center; background: #0d0e10; padding: 16px 0; border-radius: 12px; margin-top: 20px; flex-wrap: wrap;
}
.bottom-bar button:not(.btn-close) {
    border: none; font-size: 18px; width: 120px; height: 56px; border-radius: 18px; cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 3px 6px rgba(0, 0, 0, 0.6); transition: all 0.2s ease;
}
.bottom-bar button:hover { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 0 10px rgba(212, 175, 55, 0.5); transform: translateY(-1px); }
.bottom-bar button:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5); }
.btn-reset { background: #8c929a; color: #16181a; }
.btn-copy { background: #a0a6b0; color: #16181a; }
.btn-save { background: #d4af37; color: #16181a; }
.btn-add-bot { background: #16181a; color: #d4af37; border: 1px solid #8c929a !important; }
.btn-close {
    width: 56px; height: 56px; border-radius: 18px; background: #5b6068; color: #fff; font-weight: bold; font-size: 24px; padding: 0; border: none; cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 3px 6px rgba(0, 0, 0, 0.6); transition: all 0.2s ease;
}
.btn-close:hover { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 0 8px rgba(91, 96, 104, 0.8); transform: translateY(-1px); }
.btn-close:active { transform: translateY(1px); }

body { background-color: #0d0e10 !important; min-height: 100vh; padding: 40px 20px; color: #dcd6cd; overflow-x: hidden; }
@media (max-width: 550px) {
    .three-panel { grid-template-columns: 1fr; justify-items: center; } .panel { width: 100%; max-width: 504px; }
    .wide-grid { grid-template-columns: 1fr; } .lever-content-wrap { flex-direction: column; align-items: flex-start; }
    .lever-custom-item .input-slot { width: 100% !important; }
}
@media (max-width: 720px) { .header-info-bar { flex-wrap: wrap; } body { padding: 10px 5px; } }
</style>
</head>
<body>
<div class="wrapper">
    
    <div class="raid-nav">
        <a href="Arma.html" class="active">Arma</a>
        <a href="Nezarun.html">Nezarun</a>
        <a href="Yertirand.html">Yertirand</a>
    </div>

    <div class="screenshot-area">
        <div class="header">
            <div class="header-title-row">
                <h1>Arma</h1>
            </div>
            <div class="header-info-bar">
                <span>Time:</span>
                <input class="input-slot" data-id="time" style="width:80px !important;">
                <span>ST</span>
                <span>|</span>
                <input class="input-slot narrow" data-id="st" style="width:40px !important;">
                <span>Seals</span>
                <span>|</span>
                <span>CH</span>
                <input class="input-slot narrow" data-id="ch" style="width:40px !important;">
                <span>|</span>
                <span>Spot</span>
                <input class="input-slot spot-wide" data-id="spot" style="width:110px !important;">
            </div>
        </div>

        <div class="wide-top-panel">
            <div class="panel-title" style="margin-bottom:10px;">START</div>
            <div class="wide-grid">
                <div class="wide-column">
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Swordie/5Serker.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Mage/DG.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/3Assassin.png" alt=""></div></div><input class="input-slot"></div>
                </div>
                <div class="wide-column">
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item">
                        <div style="height: 44px; display: flex; align-items: center;">
                            <span class="lever-text" style="color: #d4af37; font-size: 20px; white-space: nowrap; text-shadow: 0 0 4px rgba(212, 175, 55, 0.4);">Lever 1</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="three-panel">
            <div class="panel">
                <div class="panel-title">MID</div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Elemental.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Jinn.png" alt=""></div></div><input class="input-slot"></div>
            </div>

            <div class="panel">
                <div class="panel-title">BOSS</div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Elemental.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Nasus.png" alt=""></div></div><input class="input-slot"></div>
            </div>
        </div>

        <div class="wide-top-panel" style="margin-bottom: 0;">
            <div class="panel-title" style="margin-bottom:10px;">LEVERS & PORTAL</div>
            <div class="lever-panel-grid">
                <div class="lever-custom-item">
                    <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/7Scout.png" alt=""></div></div>
                    <div class="lever-content-wrap">
                        <span class="lever-text">Lever 2 + Portal</span>
                        <input class="input-slot">
                    </div>
                </div>
                <div class="lever-custom-item">
                    <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/7Scout.png" alt=""></div></div>
                    <div class="lever-content-wrap">
                        <span class="lever-text">Lever 3</span>
                        <input class="input-slot">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="btn-reset">Reset</button>
        <button class="btn-copy">Copy</button>
        <button class="btn-save">Save</button>
        <button class="btn-add-bot">+ Add PSP</button>
        <button class="btn-close">×</button>
    </div>
</div>

<script>
if (localStorage.getItem('nexarun_planner_three_col_data')) {
    const saved = JSON.parse(localStorage.getItem('nexarun_planner_three_col_data'));
    if (saved.some(item => item.val === 'Empty')) {
        localStorage.removeItem('nexarun_planner_three_col_data');
    }
}

const copyBtn = document.querySelector('.btn-copy');
copyBtn.addEventListener('click', async () => {
    copyBtn.disabled = true;
    const originalText = copyBtn.innerText;
    try {
        await document.fonts.ready;
        const target = document.querySelector('.screenshot-area');
        const canvas = await html2canvas(target, {
            backgroundColor: "#0d0e10",
            useCORS: true,
            scale: 2,
            logging: false,
           onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.panel, .wide-top-panel').forEach(el => {
                    el.style.boxShadow = 'none';
                    el.style.backgroundColor = '#0d0e10';
                    el.style.borderRadius = '14px';
                });
                clonedDoc.querySelectorAll('.header-info-bar').forEach(bar => { bar.style.gap = '6px'; });
                clonedDoc.querySelectorAll('input').forEach(input => {
                    const computedStyle = clonedDoc.defaultView.getComputedStyle(input);
                    if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') return;
                    
                    const div = clonedDoc.createElement('div');
                    div.className = input.className;
                    div.innerText = input.value;
                    div.style.cssText = input.style.cssText;
                    div.style.display = 'flex'; div.style.alignItems = 'center';
                    div.style.backgroundColor = '#16181a'; div.style.transform = 'translateY(1px)'; div.style.color = '#ffffff';

                    if (input.closest && input.closest('.header-info-bar')) {
                        div.style.fontSize = input.classList.contains('spot-wide') ? '24px' : '26px';
                        div.style.backgroundColor = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                    } else {
                        div.style.fontSize = '20px';
                    }

                    div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                    if (input.parentNode) input.parentNode.replaceChild(div, input);
                });
            }
        });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } catch (err) {
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});

document.querySelector('.btn-reset').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(input => { input.value = ''; });
    localStorage.removeItem('nexarun_planner_three_col_data');
});

const saveBtn = document.querySelector('.btn-save');
saveBtn.addEventListener('click', () => {
    const data = [];
    document.querySelectorAll('input').forEach((input, index) => { data.push({ index, val: input.value }); });
    localStorage.setItem('nexarun_planner_three_col_data', JSON.stringify(data));
    const originalText = saveBtn.innerText;
    saveBtn.innerText = "Saved!";
    setTimeout(() => { saveBtn.innerText = originalText; }, 1500);
});

function loadSavedData() {
    const saved = localStorage.getItem('nexarun_planner_three_col_data');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            const inputs = document.querySelectorAll('input');
            if (data.length === inputs.length) {
                data.length && data.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; } });
            }
        } catch (e) {}
    }
}
window.addEventListener('DOMContentLoaded', loadSavedData);
</script>
</body>
</html>
