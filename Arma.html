<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Chela One", cursive; }
body {
    background: #000000 !important;
    min-height: 100vh;
    padding: 40px 20px;
    color: #dcd6cd;
    overflow-x: hidden;
    position: relative;
}

/* 🌟 Canvas 星空背景 */
#gear-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: -1;
}

/* 背景動態微光 - Arma 金色系 */
body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(244, 180, 26, 0.12) 0%, #000000 70%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -2;
}

@keyframes bgPulse {
    0% { transform: scale(0.8) translate(-10px, -10px); opacity: 0.5; }
    100% { transform: scale(1.2) translate(10px, 10px); opacity: 1; }
}

.wrapper {
    position: relative;
    z-index: 2;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 40px auto;
    transform: scale(1.05);
    transform-origin: top center;
}
/* Arma 主題導航列 */
.raid-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 22px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.raid-nav a {
    color: #dcd6cd;
    text-decoration: none;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 8px 24px;
    border-radius: 10px;
    background: #08060c;
    border: 1px solid #3a3f47;
    position: relative;
    transition: all 0.3s ease;
    overflow: hidden;
}
.raid-nav a::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(244, 180, 26, 0.4), transparent);
    transition: 0.5s;
}
.raid-nav a:hover::after { left: 100%; }
.raid-nav a:hover {
    color: #f4b41a;
    border-color: #f4b41a;
    box-shadow: 0 0 15px rgba(244, 180, 26, 0.4);
    transform: translateY(-3px);
}
.raid-nav a.active {
    color: #000000;
    background: #f4b41a;
    border-color: #ffd700;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(244, 180, 26, 0.7);
    animation: activeGlow 2s infinite alternate;
}
@keyframes activeGlow {
    0% { box-shadow: 0 0 10px rgba(244, 180, 26, 0.4); }
    100% { box-shadow: 0 0 22px rgba(244, 180, 26, 0.8); }
}
.screenshot-area {
    background: #030305 !important;
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(244, 180, 26, 0.3);
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    position: relative;
}
/* Header */
.header { text-align: center; margin-bottom: 22px; }
.header-title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 0 16px 0;
}
.header-title-row::before, .header-title-row::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, #f4b41a, transparent);
    box-shadow: 0 0 8px #f4b41a;
}
.header h1 {
    font-size: 56px;
    color: #f4b41a;
    font-family: "Kavoon", cursive;
    letter-spacing: 6px;
    position: relative;
    text-shadow: 0 0 10px rgba(244, 180, 26, 0.6), 0 0 20px rgba(244, 180, 26, 0.3);
    animation: neonPulseHeader 2s ease-in-out infinite alternate, floatTitle 3s ease-in-out infinite;
}
.header h1::before, .header h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    background: #f4b41a;
    transform: translateY(-50%) rotate(45deg);
    box-shadow: 0 0 10px #f4b41a;
    animation: spinDiamond 4s linear infinite;
}
.header h1::before { left: -24px; }
.header h1::after { right: -24px; }
@keyframes spinDiamond {
    0% { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }
}
.header-info-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 20px;
    color: #f4b41a;
}
.header-info-bar span { letter-spacing: 1px; }
.wide-top-panel, .panel {
    background: radial-gradient(circle at 50% 15%, #120d1a 0%, #020204 80%) !important;
    border: 2px solid #3a3f47;
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.wide-top-panel::before, .panel::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(240, 181, 42, 0.8), transparent 30%);
    animation: rotateBorder 6s linear infinite;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}
.wide-top-panel::after, .panel::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: #020204;
    border-radius: 12px;
    z-index: 0;
    pointer-events: none;
}
.wide-top-panel:hover, .panel:hover {
    border-color: #f4b41a;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(244, 180, 26, 0.3), 0 0 15px rgba(244, 180, 26, 0.4);
}
.wide-top-panel:hover::before, .panel:hover::before {
    opacity: 1;
    animation-duration: 3s;
}
@keyframes rotateBorder {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.wide-top-panel > *, .panel > * {
    position: relative;
    z-index: 1;
}
.wide-top-panel { width: 504px; max-width: 100%; margin: 0 auto 16px auto; }
.three-panel {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: 16px;
    margin-bottom: 16px;
    justify-content: center;
}
.panel { width: 244px; }
.panel-title {
    font-size: 24px;
    color: #f4b41a;
    margin-bottom: 14px;
    text-shadow: 0 0 8px rgba(244, 180, 26, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: pulseTitle 2s ease-in-out infinite alternate;
}
.panel-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: #f4b41a;
    box-shadow: 0 0 8px #f4b41a;
}
@keyframes pulseTitle {
    0% { opacity: 0.8; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(2px); }
}
.wide-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.wide-column { display: flex; flex-direction: column; gap: 10px; }
.wide-item, .row-item {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 10px;
    align-items: center;
    width: 100%;
}
.row-item { margin-bottom: 10px; }
.row-item:last-child { margin-bottom: 0; }
.icon-wrap { display: flex; gap: 4px; width: 44px; height: 44px; align-items: center; justify-content: center; }
.icon-slot {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    cursor: pointer;
    position: relative;
    background: transparent;
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
.icon-slot img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 0.25s ease, filter 0.25s ease;
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
}
.icon-slot:hover img {
    transform: scale(1.22) rotate(4deg) translateZ(0);
    filter: drop-shadow(0 0 8px rgba(244, 180, 26, 0.85));
}
.input-slot {
    background: #08060c;
    border: 1px solid #3a3f47;
    border-radius: 6px;
    padding: 0 10px;
    height: 38px;
    width: 146px !important;
    color: #ffffff;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    transition: all 0.25s ease;
}
.input-slot:hover {
    border-color: #8c929a;
    background: #110c1c;
    box-shadow: 0 0 8px rgba(244, 180, 26, 0.25);
}
.input-slot:focus {
    outline: none;
    border-color: #f4b41a;
    box-shadow: 0 0 12px rgba(244, 180, 26, 0.6);
    background: #171024;
    transform: scale(1.02);
}
.header-info-bar .input-slot {
    height: 36px;
    background: #08060c;
    border: 1px solid #8c929a;
    border-radius: 6px;
    padding: 0 10px;
    color: #ffffff;
    font-size: 22px;
    text-align: center;
    justify-content: center;
}
.header-info-bar .input-slot[data-id="time"] {
    width: 80px !important;
}
.header-info-bar .input-slot.time-narrow { width: 80px !important; }
.header-info-bar .input-slot.narrow { width: 40px !important; }
.header-info-bar .input-slot.spot-wide { width: 110px !important; }
.header-info-bar .input-slot:hover {
    border-color: #f4b41a;
    box-shadow: 0 0 8px rgba(244, 180, 26, 0.4);
}
.header-info-bar .input-slot:focus {
    border-color: #f4b41a;
    box-shadow: 0 0 14px rgba(244, 180, 26, 0.7);
    transform: scale(1.06);
}
.lever-panel-grid { display: flex; flex-direction: column; gap: 10px; }
.lever-custom-item { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.lever-content-wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.lever-custom-item .lever-text, .lever-text {
    font-family: "Chela One", cursive;
    font-size: 20px;
    color: #f4b41a;
    white-space: nowrap;
    text-shadow: 0 0 6px rgba(244, 180, 26, 0.4);
}
/* Bottom Bar */
.bottom-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    background: #030305;
    padding: 16px 0;
    border-radius: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    border: 1px solid #1a1c20;
}
.bottom-bar button:not(.btn-close) {
    border: none;
    font-size: 18px;
    width: 120px;
    height: 52px;
    border-radius: 14px;
    cursor: pointer;
    font-family: "Chela One", cursive;
    letter-spacing: 1px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
}
.bottom-bar button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 15px rgba(244, 180, 26, 0.4);
}
.bottom-bar button:active { transform: translateY(1px); }
.btn-reset { background: #8c929a; color: #16181a; }
.btn-copy { background: #a0a6b0; color: #16181a; }
.btn-save { background: #f4b41a; color: #16181a; font-weight: bold; }
.btn-add-bot { background: #030305; color: #f4b41a; border: 1px solid #f4b41a !important; }
.btn-close {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: #5b6068;
    color: #fff;
    font-weight: bold;
    font-size: 24px;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
}
.btn-close:hover { background: #e04a4a; transform: translateY(-3px) rotate(90deg); box-shadow: 0 0 12px rgba(224, 74, 74, 0.6); }
/* Modal */
#icon-modal, #reset-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
}
.modal-content {
    background: radial-gradient(circle at 50% 15%, #150f20 0%, #020204 85%);
    border: 2px solid #f4b41a;
    border-radius: 16px;
    padding: 25px;
    width: 900px;
    max-width: 95vw;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 25px rgba(244, 180, 26, 0.3);
    animation: modalPopup 0.2s ease-out;
}
.reset-modal-box {
    background: radial-gradient(circle at 50% 15%, #150f20 0%, #020204 85%);
    border: 2px solid #f4b41a;
    border-radius: 16px;
    padding: 25px;
    width: 350px; max-width: 90vw;
    text-align: center;
    box-shadow: 0 0 25px rgba(244, 180, 26, 0.4);
    animation: modalPopup 0.2s ease-out;
}
.reset-modal-title { font-size: 26px; color: #f4b41a; margin-bottom: 20px; text-shadow: 0 0 8px rgba(244, 180, 26, 0.5); }
.reset-modal-btns { display: flex; gap: 12px; justify-content: center; }
.reset-modal-btns button {
    border: none; font-size: 18px; width: 100px; height: 44px; border-radius: 12px; cursor: pointer;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.btn-confirm-yes { background: #f4b41a; color: #16181a; font-weight: bold; }
.btn-confirm-no { background: #8c929a; color: #16181a; }
@keyframes modalPopup {
    0% { transform: scale(0.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes floatTitle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
@keyframes neonPulseHeader {
    0% { text-shadow: 0 0 8px rgba(244, 180, 26, 0.4); }
    100% { text-shadow: 0 0 20px rgba(244, 180, 26, 0.9), 0 0 30px rgba(255, 215, 0, 0.6); }
}
.modal-header {
    font-size: 26px; color: #f4b41a; margin-bottom: 12px; text-align: center;
    letter-spacing: 2px; text-shadow: 0 0 8px rgba(244, 180, 26, 0.5);
    border-bottom: 1px solid rgba(244, 180, 26, 0.3); padding-bottom: 8px;
}
.modal-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
.tab-btn {
    background: #08060c; border: 1px solid #3a3f47; color: #dcd6cd; font-size: 22px;
    padding: 8px 18px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.tab-btn:hover { border-color: #f4b41a; color: #ffd700; transform: translateY(-2px); }
.tab-btn.active { background: #f4b41a; border-color: #ffd700; color: #000000; font-weight: bold; box-shadow: 0 0 10px rgba(244, 180, 26, 0.5); }
.icon-grid {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 16px;
    overflow-y: auto;
    padding: 6px;
    max-height: 580px;
    margin-bottom: 16px;
    align-items: center;
}
.icon-grid::-webkit-scrollbar { width: 6px; }
.icon-grid::-webkit-scrollbar-track { background: #08060c; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb { background: #8c929a; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb:hover { background: #f4b41a; }
.icon-option {
    width: 100%; aspect-ratio: 1 / 1;
    background: transparent;
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
}
.icon-option:hover {
    transform: scale(1.22) rotate(4deg) translateZ(0);
}
.icon-option img {
    width: 90%; height: 90%;
    object-fit: contain;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}
.icon-option:hover img {
    filter: drop-shadow(0 0 8px rgba(244, 180, 26, 0.8));
}
.modal-close-btn {
    background: #8c929a; color: #16181a; border: none; padding: 10px; border-radius: 10px;
    font-size: 18px; cursor: pointer; font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.modal-close-btn:hover { background: #f4b41a; color: #000000; transform: translateY(-2px); }
@media (max-width: 550px) {
    .wrapper { transform: none; }
    .three-panel { grid-template-columns: 1fr; justify-items: center; }
    .panel { width: 100%; max-width: 504px; }
    .wide-grid { grid-template-columns: 1fr; }
    .lever-content-wrap { flex-direction: column; align-items: flex-start; }
    .lever-custom-item .input-slot { width: 100% !important; }
}
@media (max-width: 720px) { .header-info-bar { flex-wrap: wrap; } body { padding: 10px 5px; } }
</style>
</head>
<body>
<!-- 🌟 星空與高效能滑鼠拖尾特效 Canvas -->
<canvas id="gear-canvas"></canvas>
<div class="wrapper">
    
    <div class="raid-nav">
        <a href="Arma.html" class="active">Arma</a>
        <a href="Nezarun.html">Nezarun</a>
        <a href="Yertirand.html">Yertirand</a>
    </div>
    <div class="screenshot-area">
        <div class="header">
            <div class="header-title-row">
                <h1>Arma</h1>
            </div>
            <div class="header-info-bar">
                <span>Time:</span>
                <input class="input-slot time-narrow" data-id="time">
                <span>ST</span>
                <span>|</span>
                <input class="input-slot narrow" data-id="st">
                <span>Seals</span>
                <span>|</span>
                <span>CH</span>
                <input class="input-slot narrow" data-id="ch">
                <span>|</span>
                <span>Spot</span>
                <input class="input-slot spot-wide" data-id="spot">
            </div>
        </div>
        <div class="wide-top-panel">
            <div class="panel-title" style="margin-bottom:10px;">START</div>
            <div class="wide-grid">
                <div class="wide-column">
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Swordie/5Serker.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Mage/DG.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/3Assassin.png" alt=""></div></div><input class="input-slot"></div>
                </div>
                <div class="wide-column">
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                    <div class="wide-item">
                        <div style="height: 44px; display: flex; align-items: center;">
                            <span class="lever-text">Lever 1</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="three-panel">
            <div class="panel">
                <div class="panel-title">MID</div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Elemental.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Jinn.png" alt=""></div></div><input class="input-slot"></div>
            </div>
            <div class="panel">
                <div class="panel-title">BOSS</div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Elemental.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div></div><input class="input-slot"></div>
                <div class="row-item"><div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Nasus.png" alt=""></div></div><input class="input-slot"></div>
            </div>
        </div>
        <div class="wide-top-panel" style="margin-bottom: 0;">
            <div class="panel-title" style="margin-bottom:10px;">LEVERS & PORTAL</div>
            <div class="lever-panel-grid">
                <div class="lever-custom-item">
                    <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/7Scout.png" alt=""></div></div>
                    <div class="lever-content-wrap">
                        <span class="lever-text">Lever 2 + Portal</span>
                        <input class="input-slot">
                    </div>
                </div>
                <div class="lever-custom-item">
                    <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/7Scout.png" alt=""></div></div>
                    <div class="lever-content-wrap">
                        <span class="lever-text">Lever 3</span>
                        <input class="input-slot">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom-bar">
        <button class="btn-reset">Reset</button>
        <button class="btn-copy">Copy</button>
        <button class="btn-save">Save</button>
        <button class="btn-add-bot">+ Add PSP</button>
        <button class="btn-close">×</button>
    </div>
</div>
<div id="icon-modal">
    <div class="modal-content">
        <div class="modal-header">Select Icon</div>
        <div class="modal-tabs" id="modal-tabs-container">
            <button class="tab-btn active" data-category="Swordsman">Swordsman</button>
            <button class="tab-btn" data-category="Archer">Archer</button>
            <button class="tab-btn" data-category="Mage">Mage</button>
            <button class="tab-btn" data-category="MartialArtist">Martial Artist</button>
            <button class="tab-btn" data-category="PSPs">PSPs</button>
        </div>
        <div class="icon-grid" id="icon-grid-container"></div>
        <button class="modal-close-btn" id="modal-close-btn">Cancel</button>
    </div>
</div>
<div id="reset-modal">
    <div class="reset-modal-box">
        <div class="reset-modal-title">Confirm Reset</div>
        <div class="reset-modal-btns">
            <button class="btn-confirm-yes" id="reset-yes">Confirm</button>
            <button class="btn-confirm-no" id="reset-no">Cancel</button>
        </div>
    </div>
</div>
<script>
const iconCategories = {
    "Swordsman": [

        "./IMG/SPS/Swordie/3Ninja.png",
        "./IMG/SPS/Swordie/4Sader.png",
        "./IMG/SPS/Swordie/5Serker.png",
        "./IMG/SPS/Swordie/6Gladi.png",
        "./IMG/SPS/Swordie/7Monk.png",
        "./IMG/SPS/Swordie/8Death.png",
        "./IMG/SPS/Swordie/9Rene.png",
        "./IMG/SPS/Swordie/10WB.png",
        "./IMG/SPS/Swordie/11Dk.png",
        "./IMG/SPS/Swordie/12StoneBreaker.png",
        "./IMG/SPS/Swordie/13Achilles.png"
    ],
    "Archer": [
        "./IMG/SPS/Archer/2Ranger.png",
        "./IMG/SPS/Archer/3Assassin.png",
        "./IMG/SPS/Archer/4Des.png",
        "./IMG/SPS/Archer/5Wk.png",
        "./IMG/SPS/Archer/6FireCannoneer.png",
        "./IMG/SPS/Archer/7Scout.png",
        "./IMG/SPS/Archer/8DemonHunter.png",
        "./IMG/SPS/Archer/9AA.png",
        "./IMG/SPS/Archer/10Sunchaser.png",
        "./IMG/SPS/Archer/11Blaster.png",
        "./IMG/SPS/Archer/12FogHunter.png",
        "./IMG/SPS/Archer/AdmiralYi.png"
    ],
    "Mage": [
        "./IMG/SPS/Mage/2Red.png",
        "./IMG/SPS/Mage/3Holy.png",
        "./IMG/SPS/Mage/4Blue.png",
        "./IMG/SPS/Mage/DG.png",
        "./IMG/SPS/Mage/Volcano.png",
        "./IMG/SPS/Mage/7Tl.png",
        "./IMG/SPS/Mage/8Seer.png",
        "./IMG/SPS/Mage/9Am.png",
        "./IMG/SPS/Mage/10Voodoo.png",

    ],
    "MartialArtist": [
        "./IMG/SPS/MartialArtist/DraconicFist.png",
        "./IMG/SPS/MartialArtist/Mystic.png",
        "./IMG/SPS/MartialArtist/MasterWolf.png",
        "./IMG/SPS/MartialArtist/DW.png",
        "./IMG/SPS/MartialArtist/Druid.png",
        "./IMG/SPS/MartialArtist/Hydraulic.png",
        "./IMG/SPS/MartialArtist/Thunderer.png",
        "./IMG/SPS/MartialArtist/13Thor.png"
    ],
    "PSPs": [
        "./IMG/PSP/Primary.png",
        "./IMG/PSP/Secondary.png",
        "./IMG/PSP/Elemental.png",
        "./IMG/PSP/Ragnar.png",
        "./IMG/PSP/Nezarun.png",
        "./IMG/PSP/Nasus.png",
        "./IMG/PSP/Lucy.png",
        "./IMG/PSP/Cheongbi.png",
        "./IMG/PSP/Venus.png",
        "./IMG/PSP/Eliza.png",
        "./IMG/PSP/MadMarch.png",
        "./IMG/PSP/Test.png",
        "./IMG/PSP/3dd.png"
    ]
};
let currentActiveIconSlot = null;
let currentCategory = "Swordsman";
const modal = document.getElementById('icon-modal');
const iconGridContainer = document.getElementById('icon-grid-container');
const resetModal = document.getElementById('reset-modal');

function renderIcons(category) {
    iconGridContainer.innerHTML = '';
    const icons = iconCategories[category] || [];
    if (icons.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #8c929a; padding: 20px;';
        emptyDiv.innerText = 'No icons available';
        iconGridContainer.appendChild(emptyDiv);
    } else {
        icons.forEach(src => {
            const opt = document.createElement('div');
            opt.className = 'icon-option';
            const img = document.createElement('img');
            img.src = src;
            opt.appendChild(img);
            opt.addEventListener('click', () => {
                if (currentActiveIconSlot) {
                    const slotImg = currentActiveIconSlot.querySelector('img');
                    if (slotImg) {
                        slotImg.src = src;
                        autoSaveData();
                    }
                }
                modal.style.display = 'none';
            });
            iconGridContainer.appendChild(opt);
        });
    }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderIcons(currentCategory);
    });
});
document.querySelectorAll('.icon-slot').forEach(slot => {
    slot.addEventListener('click', () => {
        currentActiveIconSlot = slot;
        modal.style.display = 'flex';
        renderIcons(currentCategory);
    });
});
document.getElementById('modal-close-btn').addEventListener('click', () => {
    modal.style.display = 'none';
});
window.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.style.display = 'none';
    }
    if (e.target === resetModal) {
        resetModal.style.display = 'none';
    }
});

const copyBtn = document.querySelector('.btn-copy');
copyBtn.addEventListener('click', async () => {
    copyBtn.disabled = true;
    const originalText = copyBtn.innerText;
    try {
        await document.fonts.ready;
        const target = document.querySelector('.screenshot-area');
        
        const originalInputs = Array.from(document.querySelectorAll('input'));

        const canvas = await html2canvas(target, {
            backgroundColor: "#030305",
            useCORS: true,
            scale: 2,
            logging: false,
            onclone: (clonedDoc) => {
                const clonedInputs = Array.from(clonedDoc.querySelectorAll('input'));
                clonedInputs.forEach((clonedInput, idx) => {
                    if (originalInputs[idx]) {
                        clonedInput.setAttribute('value', originalInputs[idx].value);
                    }
                });
            }
        });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([
            new ClipboardItem({ "image/png": blob })
        ]);
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } catch (err) {
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});

function autoSaveData() {
    const data = { inputs: [], icons: [] };
    document.querySelectorAll('input').forEach((input, index) => { data.inputs.push({ index, val: input.value }); });
    document.querySelectorAll('.icon-slot img').forEach((img, index) => { data.icons.push({ index, src: img.getAttribute('src') }); });
    localStorage.setItem('arma_planner_data_v2', JSON.stringify(data));
}

document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', autoSaveData);
});

document.querySelector('.btn-reset').addEventListener('click', () => {
    resetModal.style.display = 'flex';
});
document.getElementById('reset-no').addEventListener('click', () => {
    resetModal.style.display = 'none';
});

document.getElementById('reset-yes').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(input => { input.value = ''; });
    document.querySelectorAll('.icon-slot img').forEach(img => {
        if (img.dataset.defaultSrc) {
            img.src = img.dataset.defaultSrc;
        }
    });
    localStorage.removeItem('arma_planner_data_v2');
    resetModal.style.display = 'none';
});

const saveBtn = document.querySelector('.btn-save');
saveBtn.addEventListener('click', () => {
    autoSaveData();
    const originalText = saveBtn.innerText;
    saveBtn.innerText = "Saved!";
    setTimeout(() => { saveBtn.innerText = originalText; }, 1500);
});

function loadSavedData() {
    const saved = localStorage.getItem('arma_planner_data_v2');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (Array.isArray(data)) {
                const inputs = document.querySelectorAll('input');
                data.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; } });
                return;
            }
            if (data.inputs) {
                const inputs = document.querySelectorAll('input');
                data.inputs.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; } });
            }
            if (data.icons) {
                const imgs = document.querySelectorAll('.icon-slot img');
                data.icons.forEach(item => { if (imgs[item.index]) { imgs[item.index].src = item.src; } });
            }
        } catch (e) {
            console.error("Failed to load saved data:", e);
        }
    }
}

window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.icon-slot img').forEach(img => {
        img.dataset.defaultSrc = img.getAttribute('src');
    });
    loadSavedData();
});

// --- 🌟 星空與流暢高效能彗星拖尾特效 Canvas (對齊 Yertirand) ---
const canvas = document.getElementById('gear-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDreamyStars();
});

let dreamStars = [];
function initDreamyStars() {
    dreamStars = [];
    const count = Math.min(100, Math.floor((width * height) / 9000));
    for (let i = 0; i < count; i++) {
        dreamStars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2.2 + 0.8,
            alpha: Math.random() * 0.7 + 0.2,
            pulseSpeed: Math.random() * 0.03 + 0.005,
            vx: (Math.random() - 0.5) * 0.1,
            vy: (Math.random() - 0.5) * 0.1,
            isSparkle: Math.random() > 0.8
        });
    }
}
initDreamyStars();

let mouseX = width / 2;
let mouseY = height / 2;
let targetX = width / 2;
let targetY = height / 2;

const historyPoints = [];
const maxHistoryLength = 28;

window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
});

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

let isPageVisible = true;
document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) {
        requestAnimationFrame(animateDreamEffect);
    }
});

function animateDreamEffect() {
    if (!isPageVisible) return;

    ctx.clearRect(0, 0, width, height);

    mouseX += (targetX - mouseX) * 0.08;
    mouseY += (targetY - mouseY) * 0.08;

    historyPoints.push({ x: mouseX, y: mouseY });
    if (historyPoints.length > maxHistoryLength) {
        historyPoints.shift();
    }

    dreamStars.forEach(star => {
        star.x += star.vx;
        star.y += star.vy;
        if (star.x < 0) star.x = width;
        if (star.x > width) star.x = 0;
        if (star.y < 0) star.y = height;
        if (star.y > height) star.y = 0;

        star.alpha += Math.sin(Date.now() * star.pulseSpeed) * 0.008;
        let currentAlpha = Math.max(0.1, Math.min(0.9, star.alpha));

        if (star.isSparkle) {
            drawStar(star.x, star.y, 4, star.size * 1.5, star.size * 0.5, '#ffd700', currentAlpha);
        } else {
            ctx.fillStyle = `rgba(255, 230, 200, ${currentAlpha})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    if (historyPoints.length > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        for (let i = 1; i < historyPoints.length; i++) {
            let p1 = historyPoints[i - 1];
            let p2 = historyPoints[i];
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
        }
        ctx.strokeStyle = 'rgba(244, 180, 26, 0.4)';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    requestAnimationFrame(animateDreamEffect);
}

requestAnimationFrame(animateDreamEffect);
</script>
