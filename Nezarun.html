<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Chela One", cursive;}
.wrapper {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    transform: scale(1.05);
    transform-origin: top center;
    margin-bottom: 40px;
}
/* Nezarun 主題色導航列 (紫幻風格) */
.raid-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.raid-nav a {
    color: #b19cd9;
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 1px;
    padding: 6px 20px;
    border-radius: 8px;
    background: #0d0a14;
    border: 1px solid #353040;
    transition: all 0.25s ease;
}
.raid-nav a:hover {
    color: #cfd8dc;
    border-color: #b19cd9;
    box-shadow: 0 0 8px rgba(177, 156, 217, 0.3);
}
.raid-nav a.active {
    color: #000000;
    background: #b19cd9;
    border-color: #cfd8dc;
    box-shadow: 0 0 10px rgba(177, 156, 217, 0.5);
}

.two-panel {
    display: grid;
    grid-template-columns: auto auto;
    gap: 18px;
    margin-bottom: 24px;
    justify-content: center;
}
.panel {
    background: radial-gradient(circle at 50% 15%, #181524 0%, #000000 75%) !important;
    border: 2px solid #b19cd9;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 8px #b19cd930, inset 0 0 6px #cfd8dc10;
    width: 594px;
    max-width: 594px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    position: relative;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.panel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    pointer-events: none;
}

.row-ps, .row-sp {
    display: grid;
    grid-template-columns: 90px 143px 143px 114px;
    gap: 10px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
}
.row-ps.has-note { grid-template-columns: 90px 143px 143px 143px; }
.row-ps.jinn-row { grid-template-columns: 90px 143px; }

.row-ps .icon-wrap, .row-sp .icon-wrap {
    display: flex;
    gap: 4px;
    width: 90px;
    height: 44px;
    align-items: center;
    justify-content: flex-start;
}
.icon-slot {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
}
.icon-slot img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    display: block;
    transition: transform 0.2s ease, filter 0.2s ease;
}
.icon-slot img:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 0 5px #b19cd9aa);
}
.screenshot-area{
    background-color:#000000 !important;
    padding: 20px;
    border-radius: 16px;
}
.header{
    text-align:center;
    margin-bottom:24px;
}
.header-title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 12px 0 18px 0;
}
.header-title-row::before,
.header-title-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #cfd8dc 30%, #b19cd9 70%, transparent);
    opacity: 0.6;
    box-shadow: 0 0 6px #b19cd940;
}
.header h1 {
    font-size: 48px;
    color: #b19cd9;
    font-family: "Kavoon", cursive;
    letter-spacing: 6px;
    position: relative;
    text-shadow: 2px 0 #cfd8dc, -2px 0 #35304040, 0 0 6px #b19cd960, 0 0 12px #cfd8dc30;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.header h1::before,
.header h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #cfd8dc;
    transform: translateY(-50%);
    box-shadow: 0 0 10px #cfd8dc;
}
.header h1::before { left: -18px; }
.header h1::after { right: -18px; }

@keyframes neonPulse {
    0% { text-shadow: 2px 0 #cfd8dc, -2px 0 #35304040, 0 0 6px #b19cd960, 0 0 12px #cfd8dc30; }
    100% { text-shadow: 2px 0 #cfd8dc, -2px 0 #35304040, 0 0 8px #b19cd970, 0 0 16px #cfd8dc40; }
}

.header-info-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    font-size:22px;
    color: #9e63f7;
    text-shadow: 0 0 4px #b19cd980;
}
.header-info-bar span { letter-spacing: 1px; }
.header-info-bar .input-slot{
    width:80px;
    height:36px;
    background:#111111;
    border:1px solid #cfd8dc;
    border-radius:6px;
    padding:0 8px;
    color:#ffffff;
    font-family:"Chela One", cursive;
    font-size:22px;
    text-align:center;
    outline:none;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.25s ease;
}
.header-info-bar .input-slot.narrow{ width:40px; }
.header-info-bar .input-slot.spot-wide{ width:110px; }
.header-info-bar .input-slot:focus{ 
    outline:none; 
    border-color:#ae8fe9; 
    box-shadow: 0 0 8px #b19cd950, inset 0 0 4px #cfd8dc30; 
}

.panel-inner { display: flex; flex-direction: column; height: 100%; }
.rest-row { display: flex; gap: 8px; align-items: center; justify-content: flex-start; margin-top: auto; width: 100%; }
.rest-input {
    flex: 1;
    background: #111111;
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    padding: 0 8px;
    height: 36px;
    color: #f1f3f5;
    font-family: "Chela One", cursive;
    font-size: 22px;
    display: flex;
    align-items: center;
    transition: all 0.25s ease;
    min-width: 0;
}
.rest-input:focus {
    outline: none;
    border-color: #b19cd9;
    box-shadow: 0 0 8px #b19cd950, inset 0 0 4px #cfd8dc30;
}
.panel-title {
    font-size: 24px;
    color: #9e63f7;
    margin-bottom: 14px;
    text-shadow: 0 0 4px #b19cd980;
}
.head-labels {
    display: grid;
    grid-template-columns: 90px 143px 143px 114px;
    gap: 10px;
    text-align: left;
    color: #ae8fe9;
    font-size: 22px;
    margin-bottom: 14px;
    width: 100%;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
}
#psps-panel .head-labels { grid-template-columns: 90px 143px 143px 143px; }
.input-slot {
    background: #111111;
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    padding: 0 8px;
    height: 36px;
    width: 100%;
    color: #fffefe;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.25s ease;
    min-width: 0;
}
.input-slot:focus {
    outline: none;
    border-color:#b19cd9;
    box-shadow: 0 0 8px #b19cd950, inset 0 0 4px #cfd8dc30;
}
.row-sp > input:last-child, .row-sp > div:last-child {
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 0 4px !important;
    font-size: 16px;
    color: #999999;
}
.rest-icon { width: 32px; height: 32px; flex-shrink: 0; }
.rest-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
.bottom-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    background: #000000;
    padding: 14px 0;
    border-radius: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
}
.bottom-bar button:not(.btn-close) {
    border: none;
    font-size: 18px;
    width: 120px;
    height: 56px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 3px 6px rgba(0, 0, 0, 0.6);
    transition: all 0.2s ease;
}
.bottom-bar button:hover { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 0 12px #b19cd980; transform: translateY(-1px); }
.bottom-bar button:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5); }
.btn-reset { background: #b19cd9; color: #000; }
.btn-copy { background: #cfd8dc; color: #000; }
.btn-save { background: #e2e8f0; color: #000; }
.btn-add-bot { background: #1c1c1c; color: #b19cd9; border: 1px solid #b19cd9 !important; }
.btn-close {
    width: 56px; height: 56px; border-radius: 18px; background: #e57373; color: #fff; font-size: 24px; padding: 0; border: none; cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 3px 6px rgba(0, 0, 0, 0.6); transition: all 0.2s ease;
}
.btn-close:hover { box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 0 12px #e5737390; transform: translateY(-1px); }
.btn-close:active { transform: translateY(1px); }

.row-sp.hide-note > input:last-child, .row-sp.hide-note > div:last-child { display: none; }
.row-sp.hide-mid > input:nth-child(2), .row-sp.hide-mid > div:nth-child(2) { visibility: hidden; }
.row-ps > input:nth-child(3), .row-ps > div:nth-child(3), .row-ps > input:nth-child(4), .row-ps > div:nth-child(4) { display: none; }
.row-ps.show-boss > input:nth-child(3), .row-ps.show-boss > div:nth-child(3) { display: block; }
.row-ps.has-note > input:nth-child(4), .row-ps.has-note > div:nth-child(4) { display: block; }

body { background-color: #000000 !important; min-height: 100vh; padding: 40px 20px; color: #f1f3f5; overflow-x: hidden; }
@media (max-width: 1250px) { .two-panel { grid-template-columns: 1fr; justify-items: center; } .panel { width: 100%; max-width: 594px; } }
@media (max-width: 720px) { .header-info-bar { flex-wrap: wrap; } body { padding: 10px 5px; } }
</style>
</head>
<body>

    <div class="raid-nav">

        <a href="Nezarun.html" class="active">Nezarun</a>

    <div class="screenshot-area">

                    <div class="row-ps show-boss has-note">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Primary.png" alt=""></div></div>

                    </div>
                    
                    <div class="row-ps show-boss has-note">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Secondary.png" alt=""></div></div>

                    </div>

                    </div>

                        <div class="icon-wrap">
                            <div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div>
                            <div class="icon-slot"><img src="./IMG/PSP/Nezarun.png" alt=""></div>
                        </div>
                        <input class="input-slot" value=""><input class="input-slot" value="">
                    </div>

                    <div class="row-ps show-boss">
                        <div class="icon-wrap">
                            <div class="icon-slot"><img src="./IMG/PSP/Lucy.png" alt=""></div>
                            <div class="icon-slot"><img src="./IMG/PSP/Cheongbi.png" alt=""></div>

                        <input class="input-slot" value=""><input class="input-slot" value="">

                    <div class="row-sp hide-note">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/5Wk.png" alt=""></div></div>

                    </div>

                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Mage/3Holy.png" alt=""></div></div>
                        <input class="input-slot" value=""><input class="input-slot" value=""><input class="input-slot" value="">
                    </div>
                    <div class="row-sp hide-note">
                        <div class="icon-wrap">
                            <div class="icon-slot"><img src="./IMG/SPS/Swordie/9Rene.png" alt=""></div>
                            <div class="icon-slot"><img src="./IMG/SPS/Swordie/4Sader.png" alt=""></div>

<script>
const copyBtn = document.querySelector('.btn-copy');
copyBtn.addEventListener('click', async () => {
    copyBtn.disabled = true;
    const originalText = copyBtn.innerText;
    try {
        await document.fonts.ready;
        const target = document.querySelector('.screenshot-area');
        const canvas = await html2canvas(target, {
            backgroundColor: "#000000",
            useCORS: true,
            scale: 2,
            logging: false,
            onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.panel').forEach(el => {
                    el.style.boxShadow = 'none';
                    el.style.backgroundColor = '#000000';
                    el.style.borderRadius = '14px';
                });
                clonedDoc.querySelectorAll('.header-info-bar').forEach(bar => { bar.style.gap = '6px'; });
                clonedDoc.querySelectorAll('.row-ps, .row-sp').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length > 0 && Array.from(inputs).every(i => i.value.trim() === '')) {
                        row.style.display = 'none';
                    }
                });
                clonedDoc.querySelectorAll('input').forEach(input => {
                    if (input.classList.contains('rest-input')) return;
                    if (input.closest && input.closest('.header-info-bar')) {
                        const div = clonedDoc.createElement('div');
                        div.className = input.className;
                        div.innerText = input.value;
                        div.style.cssText = input.style.cssText;
                        div.style.display = 'flex'; div.style.alignItems = 'center';
                        div.style.backgroundColor = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                        div.style.transform = 'translateY(2.5px)'; div.style.color = '#ffffff';
                        div.style.fontSize = input.classList.contains('spot-wide') ? '24px' : '26px';
                        div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                        if (input.parentNode) input.parentNode.replaceChild(div, input);
                        return;
                    }
                    const computedStyle = clonedDoc.defaultView.getComputedStyle(input);
                    if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') return;
                    if (!input.value || input.value.trim() === "") { input.style.visibility = 'hidden'; return; }

                    const div = clonedDoc.createElement('div');
                    div.className = input.className;
                    div.innerText = input.value;
                    div.style.cssText = input.style.cssText;
                    div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.overflow = 'hidden';
                    div.style.whiteSpace = 'nowrap'; div.style.textOverflow = 'ellipsis'; div.style.minWidth = '0';
                    
                    const inputsInRow = input.parentElement.querySelectorAll('input');
                    if(input.parentElement.classList.contains('row-sp') && input === inputsInRow[inputsInRow.length - 1]){
                        div.style.background = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                        div.style.padding = '0 4px'; div.style.transform = 'translateY(2.5px)'; div.style.color = '#999999'; div.style.fontSize = '16px';
                    } else {
                        div.style.backgroundColor = '#111111'; div.style.transform = 'translateY(2.5px)'; div.style.color = '#f1f3f5'; div.style.fontSize = '20px';
                    }
                    div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                    if (input.parentNode) input.parentNode.replaceChild(div, input);
                });
            }
        });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } catch (err) {
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});

document.querySelector('.btn-reset').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(input => {
        const parent = input.parentElement;
        if (parent && (parent.classList.contains('row-sp') || parent.classList.contains('has-note'))) {
            const inputsInRow = parent.querySelectorAll('input');
            if (input === inputsInRow[inputsInRow.length - 1] && !parent.classList.contains('hide-note')) return; 
        }
        input.value = '';
        input.setAttribute('value', '');
    });
    const saveBtn = document.querySelector('.btn-save');
    if (saveBtn) saveBtn.click();
});

const saveBtn = document.querySelector('.btn-save');
saveBtn.addEventListener('click', () => {
    const data = [];
    document.querySelectorAll('input').forEach((input, index) => { data.push({ index, val: input.value }); });
    localStorage.setItem('nexarun_planner_data', JSON.stringify(data));
    const originalText = saveBtn.innerText;
    saveBtn.innerText = "Saved!";
    setTimeout(() => { saveBtn.innerText = originalText; }, 1500);
});

function loadSavedData() {
    const saved = localStorage.getItem('nexarun_planner_data');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            const inputs = document.querySelectorAll('input');
            if (data.length === inputs.length) {
                data.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; inputs[item.index].setAttribute('value', item.val); } });
            } else { localStorage.removeItem('nexarun_planner_data'); }
        } catch (e) {}
    }
}
window.addEventListener('DOMContentLoaded', loadSavedData);

document.querySelector('.btn-add-bot').addEventListener('click', () => {
    const pspsPanelInner = document.querySelector('#psps-panel .panel-inner');
    const newRow = document.createElement('div');
    newRow.className = 'row-ps show-boss has-note custom-added';
    newRow.innerHTML = `
        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/3dd.png" alt="3dd Icon"></div></div>
        <input class="input-slot" value=""><input class="input-slot" value=""><input class="input-slot" value="">
    `;
    pspsPanelInner.appendChild(newRow);
});

document.querySelector('.btn-close').addEventListener('click', () => {
    const addedRows = document.querySelectorAll('#psps-panel .row-ps.custom-added');
    if (addedRows.length > 0) addedRows[addedRows.length - 1].remove();
});
</script>
