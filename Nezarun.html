<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Chela One", cursive; }

body {
    background: #000000 !important;
    min-height: 100vh;
    padding: 40px 20px;
    color: #dcd6cd;
    overflow-x: hidden;
    position: relative;
}

/* 🌟 夢幻星空與滑鼠魔法 Canvas 層 */
#gear-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
}

.wrapper {
    position: relative;
    z-index: 2;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 40px auto;
    transform: scale(1.05);
    transform-origin: top center;
}

/* Arma 主題導航列 */
.raid-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 22px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.raid-nav a {
    color: #dcd6cd;
    text-decoration: none;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 8px 24px;
    border-radius: 10px;
    background: #08060c;
    border: 1px solid #3a3f47;
    position: relative;
    transition: all 0.3s ease;
    overflow: hidden;
}
.raid-nav a::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(157, 78, 221, 0.4), transparent);
    transition: 0.5s;
}
.raid-nav a:hover::after { left: 100%; }
.raid-nav a:hover {
    color: #e0aaff;
    border-color: #9d4edd;
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
    transform: translateY(-3px);
}
.raid-nav a.active {
    color: #000000;
    background: #9d4edd;
    border-color: #e0aaff;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(157, 78, 221, 0.7);
    animation: activeGlow 2s infinite alternate;
}

@keyframes activeGlow {
    0% { box-shadow: 0 0 10px rgba(157, 78, 221, 0.4); }
    100% { box-shadow: 0 0 22px rgba(157, 78, 221, 0.8); }
}

.screenshot-area {
    background: #030305 !important;
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(157, 78, 221, 0.3);
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    position: relative;
}

/* Header */
.header { text-align: center; margin-bottom: 22px; }
.header-title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 0 16px 0;
}
.header-title-row::before, .header-title-row::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, #9d4edd, transparent);
    box-shadow: 0 0 8px #9d4edd;
}
.header h1 {
    font-size: 56px;
    color: #c77dff;
    font-family: "Kavoon", cursive;
    letter-spacing: 6px;
    position: relative;
    text-shadow: 0 0 10px rgba(157, 78, 221, 0.6), 0 0 20px rgba(157, 78, 221, 0.3);
    animation: neonPulseHeader 2s ease-in-out infinite alternate, floatTitle 3s ease-in-out infinite;
}
.header h1::before, .header h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    background: #9d4edd;
    transform: translateY(-50%) rotate(45deg);
    box-shadow: 0 0 10px #9d4edd;
    animation: spinDiamond 4s linear infinite;
}
.header h1::before { left: -24px; }
.header h1::after { right: -24px; }

@keyframes spinDiamond {
    0% { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }
}

.header-info-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 20px;
    color: #c77dff;
}
.header-info-bar span { letter-spacing: 1px; }

.two-panel {
    display: grid;
    grid-template-columns: auto auto;
    gap: 18px;
    margin-bottom: 24px;
    justify-content: center;
}

/* 面板樣式 & Hover 動態效果 */
.panel {
    background: radial-gradient(circle at 50% 15%, #120d1a 0%, #020204 80%) !important;
    border: 2px solid #3a3f47;
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    width: 594px;
    max-width: 594px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

.panel::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(149, 43, 236, 0.8), transparent 30%);
    animation: rotateBorder 6s linear infinite;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}
.panel::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: #020204;
    border-radius: 12px;
    z-index: 0;
    pointer-events: none;
}

.panel:hover {
    border-color: #9d4edd;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(157, 78, 221, 0.3), 0 0 15px rgba(157, 78, 221, 0.4);
}
.panel:hover::before {
    opacity: 1;
    animation-duration: 3s;
}

@keyframes rotateBorder {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.panel > * {
    position: relative;
    z-index: 1;
}

.panel-inner { display: flex; flex-direction: column; height: 100%; }

.panel-title {
    font-size: 24px;
    color: #c77dff;
    margin-bottom: 14px;
    text-shadow: 0 0 8px rgba(157, 78, 221, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: pulseTitle 2s ease-in-out infinite alternate;
}
.panel-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: #9d4edd;
    box-shadow: 0 0 8px #9d4edd;
}

@keyframes pulseTitle {
    0% { opacity: 0.8; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(2px); }
}

.head-labels {
    display: grid;
    grid-template-columns: 90px 143px 143px 114px;
    gap: 10px;
    text-align: left;
    color: #c77dff;
    font-size: 22px;
    margin-bottom: 14px;
    width: 100%;
    text-shadow: 0 0 6px rgba(157, 78, 221, 0.4);
}
#psps-panel .head-labels { grid-template-columns: 90px 143px 143px 143px; }

.row-ps, .row-sp {
    display: grid;
    grid-template-columns: 90px 143px 143px 114px;
    gap: 10px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
}
.row-ps.has-note { grid-template-columns: 90px 143px 143px 143px; }
.row-ps.jinn-row { grid-template-columns: 90px 143px; }

/* 圖標懸浮與 Hover 效果 */
.row-ps .icon-wrap, .row-sp .icon-wrap {
    display: flex;
    gap: 4px;
    width: 90px;
    height: 44px;
    align-items: center;
    justify-content: flex-start;
}
.icon-slot {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    cursor: pointer;
    position: relative;
    background: transparent;
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
}
.icon-slot img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 0.25s ease, filter 0.25s ease;
}
.icon-slot:hover img {
    transform: scale(1.22) rotate(4deg);
    filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.85));
}

/* 輸入框 Hover & Focus 效果 */
.input-slot {
    background: #08060c;
    border: 1px solid #3a3f47;
    border-radius: 6px;
    padding: 0 8px;
    height: 38px;
    width: 100%;
    color: #ffffff;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.25s ease;
    min-width: 0;
}
.input-slot:hover {
    border-color: #8c929a;
    background: #110c1c;
    box-shadow: 0 0 8px rgba(157, 78, 221, 0.25);
}
.input-slot:focus {
    outline: none;
    border-color: #9d4edd;
    box-shadow: 0 0 12px rgba(157, 78, 221, 0.6);
    background: #171024;
    transform: scale(1.02);
}

.header-info-bar .input-slot {
    height: 36px;
    background: #08060c;
    border: 1px solid #8c929a;
    border-radius: 6px;
    padding: 0 10px;
    color: #ffffff;
    font-family: "Chela One", cursive;
    font-size: 22px;
    text-align: center;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
}
.header-info-bar .input-slot.time-narrow { width: 70px !important; }
.header-info-bar .input-slot.narrow { width: 40px !important; }
.header-info-bar .input-slot.spot-wide { width: 110px !important; }

.header-info-bar .input-slot:hover {
    border-color: #9d4edd;
    box-shadow: 0 0 8px rgba(157, 78, 221, 0.4);
}
.header-info-bar .input-slot:focus {
    border-color: #9d4edd;
    box-shadow: 0 0 14px rgba(157, 78, 221, 0.7);
    transform: scale(1.06);
}

.row-sp > input:last-child, .row-sp > div:last-child {
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 0 4px !important;
    font-size: 16px;
    color: #c77dff;
    text-shadow: 0 0 6px rgba(157, 78, 221, 0.4);
}

.rest-row { display: flex; gap: 8px; align-items: center; justify-content: flex-start; margin-top: auto; width: 100%; }
.rest-input {
    flex: 1;
    background: #08060c;
    border: 1px solid #3a3f47;
    border-radius: 6px;
    padding: 0 8px;
    height: 38px;
    color: #ffffff;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    transition: all 0.25s ease;
    min-width: 0;
}
.rest-input:hover {
    border-color: #8c929a;
    background: #110c1c;
    box-shadow: 0 0 8px rgba(157, 78, 221, 0.25);
}
.rest-input:focus {
    outline: none;
    border-color: #9d4edd;
    box-shadow: 0 0 12px rgba(157, 78, 221, 0.6);
    background: #171024;
}
.rest-icon { width: 32px; height: 32px; flex-shrink: 0; }
.rest-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* Bottom Bar */
.bottom-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    background: #030305;
    padding: 16px 0;
    border-radius: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    border: 1px solid #1a1c20;
}
.bottom-bar button:not(.btn-close) {
    border: none;
    font-size: 18px;
    width: 120px;
    height: 52px;
    border-radius: 14px;
    cursor: pointer;
    font-family: "Chela One", cursive;
    letter-spacing: 1px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
}
.bottom-bar button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
}
.bottom-bar button:active { transform: translateY(1px); }

.btn-reset { background: #8c929a; color: #16181a; }
.btn-copy { background: #a0a6b0; color: #16181a; }
.btn-save { background: #9d4edd; color: #ffffff; font-weight: bold; }
.btn-add-bot { background: #16181a; color: #c77dff; border: 1px solid #9d4edd !important; }

.btn-close {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: #5b6068;
    color: #fff;
    font-weight: bold;
    font-size: 24px;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
}
.btn-close:hover { background: #e04a4a; transform: translateY(-3px) rotate(90deg); box-shadow: 0 0 12px rgba(224, 74, 74, 0.6); }

/* Modal */
#icon-modal, #confirm-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
}
.modal-content {
    background: radial-gradient(circle at 50% 15%, #150f20 0%, #020204 85%);
    border: 2px solid #9d4edd;
    border-radius: 16px;
    padding: 20px;
    width: 900px; max-width: 95vw; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 0 25px rgba(157, 78, 221, 0.3);
    animation: modalPopup 0.25s ease-out;
}
.confirm-content {
    background: radial-gradient(circle at 50% 15%, #150f20 0%, #020204 85%);
    border: 2px solid #9d4edd;
    border-radius: 16px;
    padding: 25px;
    width: 350px; max-width: 90vw;
    text-align: center;
    box-shadow: 0 0 25px rgba(157, 78, 221, 0.4);
    animation: modalPopup 0.25s ease-out;
}

@keyframes modalPopup {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes floatTitle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
@keyframes neonPulseHeader {
    0% { text-shadow: 0 0 8px rgba(157, 78, 221, 0.4); }
    100% { text-shadow: 0 0 20px rgba(157, 78, 221, 0.9), 0 0 30px rgba(224, 170, 255, 0.6); }
}

.modal-header {
    font-size: 26px; color: #c77dff; margin-bottom: 12px; text-align: center;
    letter-spacing: 2px; text-shadow: 0 0 8px rgba(157, 78, 221, 0.5);
    border-bottom: 1px solid rgba(157, 78, 221, 0.3); padding-bottom: 8px;
}
.modal-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
.tab-btn {
    background: #08060c; border: 1px solid #3a3f47; color: #dcd6cd; font-size: 22px;
    padding: 8px 18px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.tab-btn:hover { border-color: #9d4edd; color: #e0aaff; transform: translateY(-2px); }
.tab-btn.active { background: #9d4edd; border-color: #e0aaff; color: #ffffff; font-weight: bold; box-shadow: 0 0 10px rgba(157, 78, 221, 0.5); }

.icon-grid {
    display: grid; grid-template-columns: repeat(13, 1fr); gap: 8px; overflow-y: auto; padding: 6px;
    max-height: 260px; margin-bottom: 16px; align-items: center;
}
.icon-grid::-webkit-scrollbar { width: 6px; }
.icon-grid::-webkit-scrollbar-track { background: #08060c; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb { background: #8c929a; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb:hover { background: #9d4edd; }

.icon-option {
    width: 100%; aspect-ratio: 1 / 1; background: transparent; border: none; border-radius: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
}
.icon-option:hover { transform: scale(1.25) rotate(4deg); }
.icon-option img { width: 90%; height: 90%; object-fit: contain; filter: drop-shadow(0 0 4px rgba(0,0,0,0.5)); }
.icon-option:hover img { filter: drop-shadow(0 0 8px rgba(157, 78, 221, 0.8)); }

.modal-close-btn {
    background: #8c929a; color: #16181a; border: none; padding: 10px; border-radius: 10px;
    font-size: 18px; cursor: pointer; font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.modal-close-btn:hover { background: #9d4edd; color: #ffffff; transform: translateY(-2px); }

.confirm-title { font-size: 26px; color: #c77dff; margin-bottom: 20px; text-shadow: 0 0 8px rgba(157, 78, 221, 0.5); }
.confirm-buttons { display: flex; gap: 12px; justify-content: center; }
.confirm-buttons button {
    border: none; font-size: 18px; width: 100px; height: 44px; border-radius: 12px; cursor: pointer;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.confirm-btn-yes { background: #9d4edd; color: #ffffff; font-weight: bold; }
.confirm-btn-no { background: #8c929a; color: #16181a; }

.row-sp.hide-note > input:last-child, .row-sp.hide-note > div:last-child { display: none; }
.row-sp.hide-mid > input:nth-child(2), .row-sp.hide-mid > div:nth-child(2) { visibility: hidden; }
.row-ps > input:nth-child(3), .row-ps > div:nth-child(3), .row-ps > input:nth-child(4), .row-ps > div:nth-child(4) { display: none; }
.row-ps.show-boss > input:nth-child(3), .row-ps.show-boss > div:nth-child(3) { display: block; }
.row-ps.has-note > input:nth-child(4), .row-ps.has-note > div:nth-child(4) { display: block; }

@media (max-width: 1250px) { .two-panel { grid-template-columns: 1fr; justify-items: center; } .panel { width: 100%; max-width: 594px; } }
@media (max-width: 720px) { .header-info-bar { flex-wrap: wrap; } body { padding: 10px 5px; } }
</style>
</head>

<div class="wrapper">

    </div>

    <div class="screenshot-area">

                <span>Time:</span>

                <span>|</span>

                <input class="input-slot spot-wide" value="" data-id="spot">

        </div>
        <div class="two-panel">

                    </div>

                    <div class="row-ps show-boss">

                    </div>

                    <div class="row-ps show-boss">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/Nasus.png" alt=""></div></div>

                    </div>

                    <div class="row-ps show-boss">
                        <div class="icon-wrap">
                            <div class="icon-slot"><img src="./IMG/PSP/Ragnar.png" alt=""></div>
                            <div class="icon-slot"><img src="./IMG/PSP/Nezarun.png" alt=""></div>

                    <div class="row-ps show-boss">

                    <div class="row-ps jinn-row">

                        <input class="input-slot" value="">
                    </div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-inner">
                    <div class="panel-title">SPS</div>
                    <div class="head-labels"><span></span><span>MID</span><span>BOSS</span><span></span></div>
                    
                    <!-- 1. 5Wk -->
                    <div class="row-sp hide-note">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Archer/5Wk.png" alt=""></div></div>
                        <input class="input-slot" value=""><input class="input-slot" value=""><input class="input-slot" value="">
                    </div>
                    
                    <!-- 2. 3Holy -->
                    <div class="row-sp hide-note">
                        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/SPS/Mage/3Holy.png" alt=""></div></div>

<!-- Icon Picker Modal -->
<div id="icon-modal">
    <div class="modal-content">
        <div class="modal-header">Select Icon</div>
        <div class="modal-tabs" id="modal-tabs-container">

            <button class="tab-btn" data-category="Archer">Archer</button>

            <button class="tab-btn" data-category="MartialArtist">Martial Artist</button>

<!-- Confirm Reset Modal -->
<div id="confirm-modal">
    <div class="confirm-content">
        <div class="confirm-title">Confirm Reset</div>
        <div class="confirm-buttons">
            <button class="confirm-btn-yes" id="confirm-yes">Confirm</button>
            <button class="confirm-btn-no" id="confirm-no">Cancel</button>
        </div>
    </div>
</div>

<script>
const iconCategories = {
    "Swordsman": [
        "./IMG/SPS/Swordie/2War.png", "./IMG/SPS/Swordie/3Ninja.png", "./IMG/SPS/Swordie/4Sader.png",
        "./IMG/SPS/Swordie/5Serker.png", "./IMG/SPS/Swordie/6Gladi.png", "./IMG/SPS/Swordie/7Monk.png",
        "./IMG/SPS/Swordie/8Death.png", "./IMG/SPS/Swordie/9Rene.png", "./IMG/SPS/Swordie/10WB.png",
        "./IMG/SPS/Swordie/11Dk.png", "./IMG/SPS/Swordie/12StoneBreaker.png", "./IMG/SPS/Swordie/13Achilles.png"
    ],
    "Archer": [
        "./IMG/SPS/Archer/2Ranger.png", "./IMG/SPS/Archer/3Assassin.png", "./IMG/SPS/Archer/4Des.png",
        "./IMG/SPS/Archer/5Wk.png", "./IMG/SPS/Archer/6FireCannoneer.png", "./IMG/SPS/Archer/7Scout.png",
        "./IMG/SPS/Archer/8DemonHunter.png", "./IMG/SPS/Archer/9AA.png", "./IMG/SPS/Archer/10Sunchaser.png",
        "./IMG/SPS/Archer/11Blaster.png", "./IMG/SPS/Archer/12FogHunter.png", "./IMG/SPS/Archer/AdmiralYi.png"
    ],
    "Mage": [
        "./IMG/SPS/Mage/2Red.png", "./IMG/SPS/Mage/3Holy.png", "./IMG/SPS/Mage/4Blue.png",
        "./IMG/SPS/Mage/DG.png", "./IMG/SPS/Mage/Volcano.png", "./IMG/SPS/Mage/7Tl.png",
        "./IMG/SPS/Mage/8Seer.png", "./IMG/SPS/Mage/9Am.png", "./IMG/SPS/Mage/10Voodoo.png",
        "./IMG/SPS/Mage/11Gravity.png", "./IMG/SPS/Mage/12FireStorm.png", "./IMG/SPS/Mage/13Merlin.png"
    ],
    "MartialArtist": [
        "./IMG/SPS/MartialArtist/DraconicFist.png", "./IMG/SPS/MartialArtist/Mystic.png",
        "./IMG/SPS/MartialArtist/MasterWolf.png", "./IMG/SPS/MartialArtist/DW.png",
        "./IMG/SPS/MartialArtist/Druid.png", "./IMG/SPS/MartialArtist/Hydraulic.png",
        "./IMG/SPS/MartialArtist/Thunderer.png", "./IMG/SPS/MartialArtist/13Thor.png"
    ],
    "PSPs": [
        "./IMG/PSP/Primary.png", "./IMG/PSP/Secondary.png", "./IMG/PSP/Elemental.png",
        "./IMG/PSP/Ragnar.png", "./IMG/PSP/Nezarun.png", "./IMG/PSP/Nasus.png",
        "./IMG/PSP/Lucy.png", "./IMG/PSP/Cheongbi.png", "./IMG/PSP/Venus.png",
        "./IMG/PSP/Eliza.png", "./IMG/PSP/MadMarch.png", "./IMG/PSP/Test.png", "./IMG/PSP/3dd.png"
    ]
};

let currentActiveIconSlot = null;
let currentCategory = "Swordsman";

const modal = document.getElementById('icon-modal');
const confirmModal = document.getElementById('confirm-modal');
const iconGridContainer = document.getElementById('icon-grid-container');

function renderIcons(category) {
    iconGridContainer.innerHTML = '';
    const icons = iconCategories[category] || [];
    icons.forEach(src => {
        const opt = document.createElement('div');
        opt.className = 'icon-option';
        const img = document.createElement('img');
        img.src = src;
        opt.appendChild(img);
        opt.addEventListener('click', () => {
            if (currentActiveIconSlot) {
                const slotImg = currentActiveIconSlot.querySelector('img');
                if (slotImg) slotImg.src = src;
            }
            modal.style.display = 'none';
            autoSaveData();
        });
        iconGridContainer.appendChild(opt);
    });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderIcons(currentCategory);
    });
});

document.querySelectorAll('.icon-slot').forEach(slot => {
    slot.addEventListener('click', () => {
        currentActiveIconSlot = slot;
        modal.style.display = 'flex';
        renderIcons(currentCategory);
    });
});

document.getElementById('modal-close-btn').addEventListener('click', () => {
    modal.style.display = 'none';
});

window.addEventListener('click', (e) => {
    if (e.target === modal) modal.style.display = 'none';
    if (e.target === confirmModal) confirmModal.style.display = 'none';
});

const copyBtn = document.querySelector('.btn-copy');
copyBtn.addEventListener('click', async () => {
    copyBtn.disabled = true;
    const originalText = copyBtn.innerText;
    try {
        await document.fonts.ready;
        const target = document.querySelector('.screenshot-area');
        const canvas = await html2canvas(target, {
            backgroundColor: "#030305",
            useCORS: true,
            scale: 2,
            logging: false,
            onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.panel').forEach(el => {
                    el.style.boxShadow = 'none';
                    el.style.backgroundColor = '#030305';
                    el.style.borderRadius = '14px';
                    el.style.transform = 'none';
                });
                clonedDoc.querySelectorAll('.header-info-bar').forEach(bar => { bar.style.gap = '6px'; });
                clonedDoc.querySelectorAll('.row-ps, .row-sp').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length > 0 && Array.from(inputs).every(i => i.value.trim() === '')) {
                        row.style.display = 'none';
                    }
                });
                clonedDoc.querySelectorAll('input').forEach(input => {
                    if (input.classList.contains('rest-input')) return;
                    if (input.closest && input.closest('.header-info-bar')) {
                        const div = clonedDoc.createElement('div');
                        div.className = input.className;
                        div.innerText = input.value;
                        div.style.cssText = input.style.cssText;
                        div.style.display = 'flex'; div.style.alignItems = 'center';
                        div.style.backgroundColor = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                        div.style.transform = 'translateY(2.5px)'; div.style.color = '#ffffff';
                        div.style.fontSize = input.classList.contains('spot-wide') ? '24px' : '26px';
                        div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.classList.contains('time-narrow') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                        if (input.parentNode) input.parentNode.replaceChild(div, input);
                        return;
                    }
                    const computedStyle = clonedDoc.defaultView.getComputedStyle(input);
                    if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') return;
                    if (!input.value || input.value.trim() === "") { input.style.visibility = 'hidden'; return; }

                    const div = clonedDoc.createElement('div');
                    div.className = input.className;
                    div.innerText = input.value;
                    div.style.cssText = input.style.cssText;
                    div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.overflow = 'hidden';
                    div.style.whiteSpace = 'nowrap'; div.style.textOverflow = 'ellipsis'; div.style.minWidth = '0';
                    
                    const inputsInRow = input.parentElement.querySelectorAll('input');
                    if(input.parentElement.classList.contains('row-sp') && input === inputsInRow[inputsInRow.length - 1]){
                        div.style.background = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                        div.style.padding = '0 4px'; div.style.transform = 'translateY(2.5px)'; div.style.color = '#c77dff'; div.style.fontSize = '16px';
                    } else {
                        div.style.backgroundColor = '#08060c'; div.style.transform = 'translateY(2.5px)'; div.style.color = '#ffffff'; div.style.fontSize = '20px';
                    }
                    div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.classList.contains('time-narrow') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                    if (input.parentNode) input.parentNode.replaceChild(div, input);
                });
            }
        });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } catch (err) {
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});

document.querySelector('.btn-reset').addEventListener('click', () => {
    confirmModal.style.display = 'flex';
});

document.getElementById('confirm-no').addEventListener('click', () => {
    confirmModal.style.display = 'none';
});

document.getElementById('confirm-yes').addEventListener('click', () => {
    confirmModal.style.display = 'none';
    document.querySelectorAll('input').forEach(input => {
        const parent = input.parentElement;
        if (parent && (parent.classList.contains('row-sp') || parent.classList.contains('has-note'))) {
            const inputsInRow = parent.querySelectorAll('input');
            if (input === inputsInRow[inputsInRow.length - 1] && !parent.classList.contains('hide-note')) return; 
        }
        input.value = '';
        input.setAttribute('value', '');
    });
    localStorage.removeItem('nezerun_planner_data_v2');
});

function autoSaveData() {
    const data = { inputs: [], icons: [] };
    document.querySelectorAll('input').forEach((input, index) => { data.inputs.push({ index, val: input.value }); });
    document.querySelectorAll('.icon-slot img').forEach((img, index) => { data.icons.push({ index, src: img.getAttribute('src') }); });
    localStorage.setItem('nezerun_planner_data_v2', JSON.stringify(data));
}

document.addEventListener('input', () => {
    autoSaveData();
});

const saveBtn = document.querySelector('.btn-save');
saveBtn.addEventListener('click', () => {
    autoSaveData();
    const originalText = saveBtn.innerText;
    saveBtn.innerText = "Saved!";
    setTimeout(() => { saveBtn.innerText = originalText; }, 1500);
});

function loadSavedData() {
    const saved = localStorage.getItem('nezerun_planner_data_v2');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
                const inputs = document.querySelectorAll('input');
                parsed.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; } });
                return;
            }
            if (parsed.inputs) {
                const inputs = document.querySelectorAll('input');
                parsed.inputs.forEach(item => { if (inputs[item.index]) { inputs[item.index].value = item.val; inputs[item.index].setAttribute('value', item.val); } });
            }
            if (parsed.icons) {
                const imgs = document.querySelectorAll('.icon-slot img');
                parsed.icons.forEach(item => { if (imgs[item.index]) { imgs[item.index].src = item.src; } });
            }
        } catch (e) {}
    }
}
window.addEventListener('DOMContentLoaded', loadSavedData);

document.querySelector('.btn-add-bot').addEventListener('click', () => {
    const pspsPanelInner = document.querySelector('#psps-panel .panel-inner');
    const newRow = document.createElement('div');
    newRow.className = 'row-ps show-boss has-note custom-added';
    newRow.innerHTML = `
        <div class="icon-wrap"><div class="icon-slot"><img src="./IMG/PSP/3dd.png" alt="3dd Icon"></div></div>
        <input class="input-slot" value=""><input class="input-slot" value=""><input class="input-slot" value="">
    `;
    pspsPanelInner.appendChild(newRow);
    
    newRow.querySelectorAll('.icon-slot').forEach(slot => {
        slot.addEventListener('click', () => {
            currentActiveIconSlot = slot;
            modal.style.display = 'flex';
            renderIcons(currentCategory);
        });
    });
    autoSaveData();
});

document.querySelector('.btn-close').addEventListener('click', () => {
    const addedRows = document.querySelectorAll('#psps-panel .row-ps.custom-added');
    if (addedRows.length > 0) {
        addedRows[addedRows.length - 1].remove();
        autoSaveData();
    }
});

// 🌟 慢速流暢彗星拖尾與星空特效 (對應 Nezerun 紫色系)
const canvas = document.getElementById('gear-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initDreamyStars();
});

// 背景星空
let dreamStars = [];
function initDreamyStars() {
    dreamStars = [];
    const count = Math.floor((width * height) / 9000);
    for (let i = 0; i < count; i++) {
        dreamStars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2.2 + 0.8,
            alpha: Math.random() * 0.7 + 0.2,
            pulseSpeed: Math.random() * 0.03 + 0.005,
            vx: (Math.random() - 0.5) * 0.1,
            vy: (Math.random() - 0.5) * 0.1,
            isSparkle: Math.random() > 0.8
        });
    }
}
initDreamyStars();

let mouseX = width / 2;
let mouseY = height / 2;
let targetX = width / 2;
let targetY = height / 2;

const historyPoints = [];
const maxHistoryLength = 28;

window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
});

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function animateDreamEffect() {
    ctx.clearRect(0, 0, width, height);

    mouseX += (targetX - mouseX) * 0.08;
    mouseY += (targetY - mouseY) * 0.08;

    historyPoints.push({ x: mouseX, y: mouseY });
    if (historyPoints.length > maxHistoryLength) {
        historyPoints.shift();
    }

    // 1. 繪製背景星空 (微調帶點粉紫星光)
    dreamStars.forEach(star => {
        star.x += star.vx;
        star.y += star.vy;
        if (star.x < 0) star.x = width;
        if (star.x > width) star.x = 0;
        if (star.y < 0) star.y = height;
        if (star.y > height) star.y = 0;

        star.alpha += Math.sin(Date.now() * star.pulseSpeed) * 0.008;
        let currentAlpha = Math.max(0.1, Math.min(0.9, star.alpha));

        if (star.isSparkle) {
            drawStar(star.x, star.y, 4, star.size * 1.5, star.size * 0.5, '#e0aaff', currentAlpha);
        } else {
            ctx.fillStyle = `rgba(224, 170, 255, ${currentAlpha})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // 2. 繪製慢速、優雅的紫色彗星流光拖尾
    if (historyPoints.length > 1) {
        ctx.save();
        ctx.shadowColor = '#9d4edd';
        ctx.shadowBlur = 12;
        
        for (let i = 1; i < historyPoints.length; i++) {
            let p1 = historyPoints[i - 1];
            let p2 = historyPoints[i];
            
            let ratio = i / historyPoints.length;
            ctx.strokeStyle = `rgba(157, 78, 221, ${ratio * 0.65})`;
            ctx.lineWidth = ratio * 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
        ctx.restore();

        // 鼠標頭部的核心亮點
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#c77dff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    requestAnimationFrame(animateDreamEffect);
}

animateDreamEffect();
</script>
