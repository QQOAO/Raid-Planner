<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Chela One", cursive;}
.wrapper {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
}
.two-panel {
    display: grid;
    grid-template-columns: auto auto;
    gap: 18px;
    margin-bottom: 24px;
    justify-content: center;
}
.right-column {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 686px;
}
.panel {
    background: radial-gradient(circle at 50% 15%, #0c1624 0%, #000000 75%) !important;
    border: 2px solid #0ea5e9;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 8px #0ea5e930, inset 0 0 6px #e2e8f010;
    width: 686px;
    max-width: 686px;
    height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    position: relative;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.panel.sps-panel {
    width: 594px;
    max-width: 594px;
}
.panel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    pointer-events: none;
}

.row-ps, .row-sp {
    display: grid;
    grid-template-columns: 90px 150px 150px;
    gap: 14px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
    position: relative;
}

.row-ps.jinn-row {
    grid-template-columns: 90px 150px 150px 150px;
}

.row-ps .icon-wrap, .row-sp .icon-wrap {
    display: flex;
    gap: 4px;
    width: 90px;
    height: 44px;
    align-items: center;
    justify-content: flex-start;
}
.icon-slot {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
}
.icon-slot img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    display: block;
    transition: transform 0.2s ease, filter 0.2s ease;
}
.icon-slot img:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 0 5px #0ea5e9aa);
}
.screenshot-area{
    background-color:#000000 !important;
    padding: 20px;
    border-radius: 16px;
}
.header{
    text-align:center;
    margin-bottom:24px;
}
.header-title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 12px 0 18px 0;
}
.header-title-row::before,
.header-title-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #e2e8f0 30%,
        #0ea5e9 70%,
        transparent
    );
    opacity: 0.6;
    box-shadow: 0 0 6px #0ea5e940;
}
.header h1 {
    font-size: 48px;
    color: #0ea5e9;
    font-family: "Kavoon", cursive;
    letter-spacing: 6px;
    position: relative;
    text-shadow:
        2px 0 #e2e8f0,
        -2px 0 #10203540,
        0 0 6px #0ea5e960,
        0 0 12px #e2e8f030;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.header h1::before,
.header h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 8px;
    height: 8px;
    background: #e2e8f0;
    transform: translateY(-50%);
    box-shadow: 0 0 10px #e2e8f0;
}
.header h1::before { left: -18px; }
.header h1::after { right: -18px; }
@keyframes neonPulse {
    0% { text-shadow: 2px 0 #e2e8f0, -2px 0 #10203540, 0 0 6px #0ea5e960, 0 0 12px #e2e8f030; }
    100% { text-shadow: 2px 0 #e2e8f0, -2px 0 #10203540, 0 0 8px #0ea5e970, 0 0 16px #e2e8f040; }
}
.header-info-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    font-size:22px;
    color:#5d96ec;
}
.header-info-bar span {
    letter-spacing: 1px;
}
.header-info-bar .input-slot{
    width:80px;
    height:36px;
    background:#111111;
    border:1px solid #8b8b8b;
    border-radius:6px;
    padding:0 8px;
    color:#ffffff;
    font-family:"Chela One", cursive;
    font-size:22px;
    text-align:center;
    outline:none;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.25s ease;
}
.header-info-bar .input-slot.narrow{ width:40px; }
.header-info-bar .input-slot.spot-wide{ width:110px; }
.header-info-bar .input-slot:focus{ 
    outline:none; 
    border-color:#0ea5e9; 
    box-shadow: 0 0 8px #0ea5e950, inset 0 0 4px #e2e8f030; 
}

.panel-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.row-note {
    position: absolute;
    left: 432px;
    font-size: 15px;
    color: #0ea5e9;
    white-space: nowrap;
    user-select: text !important;
    -webkit-user-select: text !important;
    cursor: text;
    font-weight: normal;
    text-shadow: 0 0 4px #0ea5e980;
}

.extra-bottom-row {
    display: grid;
    grid-template-columns: 44px 1fr 44px 1fr;
    gap: 14px;
    align-items: center;
    width: 686px;
    max-width: 686px;
    background: radial-gradient(circle at 50% 15%, #0c1624 0%, #000000 75%) !important;
    border: 2px solid #0ea5e9;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 8px #0ea5e930, inset 0 0 6px #e2e8f010;
    box-sizing: border-box;
    position: relative;
    animation: neonPulse 2s ease-in-out infinite alternate;
}
.extra-bottom-row::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    pointer-events: none;
}

.panel-title {
    font-size: 24px;
    color: #bae6fd;
    margin-bottom: 14px;
    text-shadow: 0 0 4px #0ea5e980;
}
.head-labels {
    display: grid;
    grid-template-columns: 90px 150px 150px;
    gap: 14px;
    text-align: left;
    color: #5d96ec;
    font-size: 22px;
    margin-bottom: 14px;
    width: 100%;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
}
#psps-panel .head-labels {
    grid-template-columns: 90px 150px 150px 150px;
}
.input-slot {
    background: #111111;
    border: 1px solid #8b8b8b;
    border-radius: 6px;
    padding: 0 8px;
    height: 36px;
    width: 100%;
    color: #fffefe;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.25s ease;
    min-width: 0;
}
.input-slot:focus {
    outline: none;
    border-color:#0ea5e9;
    box-shadow: 0 0 8px #0ea5e950, inset 0 0 4px #e2e8f030;
}

.bottom-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    background: #000000;
    padding: 14px 0;
    border-radius: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
}
.bottom-bar button:not(.btn-close) {
    border: none;
    font-size: 18px;
    width: 120px;
    height: 56px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 3px 6px rgba(0, 0, 0, 0.6);
    transition: all 0.2s ease;
}
.bottom-bar button:hover { 
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 0 12px #0ea5e980; 
    transform: translateY(-1px);
}
.bottom-bar button:active {
    transform: translateY(1px);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}
.btn-reset { background: #0ea5e9; color: #fff; }
.btn-copy { background: #e2e8f0; color: #000; }
.btn-save { background: #38bdf8; color: #000; }
.btn-add-bot { background: #1c1c1c; color: #0ea5e9; border: 1px solid #0ea5e9 !important; }
.btn-close {
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: #e57373;
    color: #fff;
    font-size: 24px;
    padding: 0;
    border: none;
    cursor: pointer;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 3px 6px rgba(0, 0, 0, 0.6);
    transition: all 0.2s ease;
}
.btn-close:hover {
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 0 12px #e5737390;
    transform: translateY(-1px);
}
.btn-close:active {
    transform: translateY(1px);
}

body {
    background-color: #000000 !important;
    min-height: 100vh;
    padding: 40px 20px;
    color: #f1f3f5;
    overflow-x: hidden;

/* 響應式：當畫面太窄時自動轉為單欄上下排列，並調整面板闊度適應細畫面 */
@media (max-width: 1350px) {
    .two-panel {
        grid-template-columns: 1fr;
        justify-items: center;
    }
    .right-column, .panel, .panel.sps-panel, .extra-bottom-row {
        width: 100%;
        max-width: 686px;
    }
}
@media (max-width: 720px) {
    .header-info-bar {
        flex-wrap: wrap;
    }
    body {
        padding: 10px 5px;
    }
}
</style>

<script>
const copyBtn = document.querySelector('.btn-copy');
copyBtn.addEventListener('click', async () => {
    copyBtn.disabled = true;
    const originalText = copyBtn.innerText;
    try {
        await document.fonts.ready;
        const target = document.querySelector('.screenshot-area');
        const canvas = await html2canvas(target, {
            backgroundColor: "#000000",
            useCORS: true,
            scale: 2,
            logging: false,
            onclone: (clonedDoc) => {
                clonedDoc.querySelectorAll('.panel, .extra-bottom-row').forEach(el => {
                    el.style.boxShadow = 'none';
                    el.style.backgroundColor = '#000000';
                    el.style.borderRadius = '14px';
                });

                clonedDoc.querySelectorAll('.row-ps, .row-sp').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs.length > 0) {
                        const allEmpty = Array.from(inputs).every(input => input.value.trim() === '');
                        if (allEmpty) {
                            row.style.display = 'none';
                        }
                    }
                });

                clonedDoc.querySelectorAll('input').forEach(input => {
                    if (input.closest && input.closest('.header-info-bar')) {
                        const div = clonedDoc.createElement('div');
                        div.className = input.className;
                        div.innerText = input.value;
                        div.style.cssText = input.style.cssText;
                        div.style.display = 'flex';
                        div.style.alignItems = 'center';
                        div.style.backgroundColor = 'transparent';
                        div.style.border = 'none';
                        div.style.boxShadow = 'none';
                        div.style.transform = 'translateY(2.5px)';
                        div.style.color = '#ffffff';

                        if (input.classList.contains('spot-wide')) {
                            div.style.fontSize = '24px';
                        } else {
                            div.style.fontSize = '26px';
                        }

                        if (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') {
                            div.style.justifyContent = 'center';
                        } else {
                            div.style.justifyContent = 'flex-start';
                        }
                        if (input.parentNode) {
                            input.parentNode.replaceChild(div, input);
                        }
                        return;
                    }

                    const computedStyle = clonedDoc.defaultView.getComputedStyle(input);
                    if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') return;
                    
                    if (!input.value || input.value.trim() === "") {
                        input.style.visibility = 'hidden';
                        return;
                    }

                    const div = clonedDoc.createElement('div');
                    div.className = input.className;
                    div.innerText = input.value;
                    div.style.cssText = input.style.cssText;
                    div.style.display = 'flex';
                    div.style.alignItems = 'center';
                    div.style.overflow = 'hidden';
                    div.style.whiteSpace = 'nowrap';
                    div.style.textOverflow = 'ellipsis';
                    div.style.minWidth = '0';
                    
                    div.style.backgroundColor = '#0c141c';
                    div.style.border = '1px solid #e2e8f0';
                    div.style.borderRadius = '6px';
                    div.style.padding = '0 8px';
                    div.style.transform = 'translateY(2.5px)';
                    div.style.color = '#ffffff';
                    div.style.fontSize = '20px';

                    if (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') {
                        div.style.justifyContent = 'center';
                    } else {
                        div.style.justifyContent = 'flex-start';
                    }
                    if (input.parentNode) {
                        input.parentNode.replaceChild(div, input);
                    }
                });
            }
        });
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([
            new ClipboardItem({ "image/png": blob })
        ]);
        
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);

    } catch (err) {
        console.error(err);
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});

document.querySelector('.btn-reset').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(input => {
        const parent = input.parentElement;
        if (parent && (parent.classList.contains('row-sp') || parent.classList.contains('has-note'))) {
            const inputsInRow = parent.querySelectorAll('input');
            if (input === inputsInRow[inputsInRow.length - 1] && !parent.classList.contains('hide-note')) {
                return; 
            }
        }
        input.value = '';
        input.setAttribute('value', '');
    });
    
    const saveBtn = document.querySelector('.btn-save');
    if (saveBtn) saveBtn.click();
});

const saveBtn = document.querySelector('.btn-save');
saveBtn.addEventListener('click', () => {
    const data = [];
    document.querySelectorAll('input').forEach((input, index) => {
        data.push({ index, val: input.value });
    });
    localStorage.setItem('nexarun_planner_data', JSON.stringify(data));
    
    const originalText = saveBtn.innerText;
    saveBtn.innerText = "Saved!";
    setTimeout(() => { saveBtn.innerText = originalText; }, 1500);
});

function loadSavedData() {
    const saved = localStorage.getItem('nexarun_planner_data');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            const inputs = document.querySelectorAll('input');
            if (data.length === inputs.length) {
                data.forEach(item => {
                    if (inputs[item.index]) {
                        inputs[item.index].value = item.val;
                        inputs[item.index].setAttribute('value', item.val);
                    }
                });
            } else {
                localStorage.removeItem('nexarun_planner_data');
            }
        } catch (e) {
            console.error("載入失敗", e);
        }
    }
}
window.addEventListener('DOMContentLoaded', loadSavedData);

const addPspBtn = document.querySelector('.btn-add-bot');
addPspBtn.addEventListener('click', () => {
    const pspsPanelInner = document.querySelector('#psps-panel .panel-inner');
    const newRow = document.createElement('div');
    newRow.className = 'row-ps jinn-row custom-added';
    newRow.innerHTML = `
        <div class="icon-wrap">
            <div class="icon-slot">
                <img src="./IMG/PSP/3dd.png" alt="3dd Icon">
            </div>
        </div>
        <input class="input-slot" value="">
        <input class="input-slot" value="">
        <input class="input-slot" value="">
    `;
    pspsPanelInner.appendChild(newRow);
});

const closeBtn = document.querySelector('.btn-close');
closeBtn.addEventListener('click', () => {
    const addedRows = document.querySelectorAll('#psps-panel .row-ps.custom-added');
    if (addedRows.length > 0) {
        addedRows[addedRows.length - 1].remove();
    }
});
</script>
