<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Kavoon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Chela One", cursive; }

body {
    background: #000000 !important;
    min-height: 100vh;
    padding: 40px 20px;
    color: #dcd6cd;
    overflow-x: hidden;
    position: relative;
}

/* Canvas 星空背景 */
#gear-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: -1;
}

/* 背景動態微光 - Yertirand 藍色系 */
body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(78, 157, 221, 0.12) 0%, #000000 70%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -2;
}

@keyframes bgPulse {
    0% { transform: scale(0.8) translate(-10px, -10px); opacity: 0.5; }
    100% { transform: scale(1.2) translate(10px, 10px); opacity: 1; }
}

.wrapper {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 40px auto;
    transform: scale(1.05);
    transform-origin: top center;
}

/* 主題導航列 */
.raid-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 22px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.raid-nav a {
    color: #dcd6cd;
    text-decoration: none;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 8px 24px;
    border-radius: 10px;
    background: #08060c;
    border: 1px solid #3a3f47;
    position: relative;
    transition: all 0.3s ease;
    overflow: hidden;
}
.raid-nav a::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(78, 157, 221, 0.4), transparent);
    transition: 0.5s;
}
.raid-nav a:hover::after { left: 100%; }
.raid-nav a:hover {
    color: #aae0ff;
    border-color: #4ed3ed;
    box-shadow: 0 0 15px rgba(78, 157, 221, 0.4);
    transform: translateY(-3px);
}
.raid-nav a.active {
    color: #000000;
    background: #4ed3ed;
    border-color: #aae0ff;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(78, 157, 221, 0.7);
    animation: activeGlow 2s infinite alternate;
}

@keyframes activeGlow {
    0% { box-shadow: 0 0 10px rgba(78, 157, 221, 0.4); }
    100% { box-shadow: 0 0 22px rgba(78, 157, 221, 0.8); }
}

.screenshot-area {
    background: #030305 !important;
    padding: 24px;
    border-radius: 20px;
    border: 1px solid rgba(78, 157, 221, 0.3);
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    position: relative;
}

/* Header */
.header { text-align: center; margin-bottom: 22px; }
.header-title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 8px 0 16px 0;
}
.header-title-row::before, .header-title-row::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, #4ed3ed, transparent);
    box-shadow: 0 0 8px #4ed3ed;
}
.header h1 {
    font-size: 56px;
    color: #7ddcff;
    font-family: "Kavoon", cursive;
    letter-spacing: 6px;
    position: relative;
    text-shadow: 0 0 10px rgba(78, 157, 221, 0.6), 0 0 20px rgba(78, 157, 221, 0.3);
    animation: neonPulseHeader 2s ease-in-out infinite alternate, floatTitle 3s ease-in-out infinite;
}
.header h1::before, .header h1::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    background: #4ed3ed;
    transform: translateY(-50%) rotate(45deg);
    box-shadow: 0 0 10px #4ed3ed;
    animation: spinDiamond 4s linear infinite;
}
.header h1::before { left: -24px; }
.header h1::after { right: -24px; }

@keyframes spinDiamond {
    0% { transform: translateY(-50%) rotate(0deg); }
    100% { transform: translateY(-50%) rotate(360deg); }
}

.header-info-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 22px;
    color: #7ddcff;
}
.header-info-bar span { letter-spacing: 1px; }

.two-panel {
    display: grid;
    grid-template-columns: auto auto;
    gap: 18px;
    margin-bottom: 24px;
    justify-content: center;
}
.right-column {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 686px;
}

/* 面板樣式 & Hover 動態效果 (藍色系) */
.panel, .extra-bottom-row {
    background: radial-gradient(circle at 50% 15%, #0d151a 0%, #020204 80%) !important;
    border: 2px solid #3a3f47;
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
}

.panel {
    width: 686px;
    max-width: 686px;
    height: 100%;
    display: flex;
    flex-direction: column;
}
.panel.sps-panel {
    width: 594px;
    max-width: 594px;
}

.panel::before, .extra-bottom-row::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(22, 135, 228, 0.8), transparent 30%);
    animation: rotateBorder 6s linear infinite;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}
.panel::after, .extra-bottom-row::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: #020204;
    border-radius: 12px;
    z-index: 0;
    pointer-events: none;
}

.panel:hover, .extra-bottom-row:hover {
    border-color: #4ed3ed;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(78, 157, 221, 0.3), 0 0 15px rgba(78, 157, 221, 0.4);
}
.panel:hover::before, .extra-bottom-row::before {
    opacity: 1;
    animation-duration: 3s;
}

@keyframes rotateBorder {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.panel > *, .extra-bottom-row > * {
    position: relative;
    z-index: 1;
}

.panel-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.panel-title {
    font-size: 24px;
    color: #7ddcff;
    margin-bottom: 14px;
    text-shadow: 0 0 8px rgba(78, 157, 221, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: pulseTitle 2s ease-in-out infinite alternate;
}
.panel-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: #4ed3ed;
    box-shadow: 0 0 8px #4ed3ed;
}

@keyframes pulseTitle {
    0% { opacity: 0.8; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(2px); }
}

.head-labels {
    display: grid;
    grid-template-columns: 90px 150px 150px;
    gap: 14px;
    text-align: left;
    color: #7ddcff;
    font-size: 22px;
    margin-bottom: 14px;
    width: 100%;
    text-shadow: 0 0 6px rgba(78, 157, 221, 0.4);
}
#psps-panel .head-labels {
    grid-template-columns: 90px 150px 150px 150px;
}

.row-sp {
    display: grid;
    grid-template-columns: 90px 150px 150px auto;
    gap: 14px;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
    position: relative;
}

.row-ps {
    display: grid;
    grid-template-columns: 90px 150px 150px 150px;
    gap: 14px;
    align-items: center;
    width: 100%;
    margin-bottom: 10px;
    position: relative;
}
/* 修正一般 2 個輸入框的行（ps_1 至 ps_6），讓它們完美對齊 4 欄網格 */
.row-ps:not(.jinn-row) {
    grid-template-columns: 90px 150px 150px 1fr;
}
.row-ps:not(.jinn-row) .input-slot:nth-child(3) {
    grid-column: 3 / 4;
}

.row-ps .icon-wrap, .row-sp .icon-wrap {
    display: flex;
    gap: 4px;
    width: 90px;
    height: 44px;
    align-items: center;
    justify-content: flex-start;
}

.row-note {
    font-size: 16px;
    color: #7ddcff;
    white-space: nowrap;
    cursor: text;
    text-shadow: 0 0 6px rgba(78, 157, 221, 0.4);
}

.extra-bottom-row {
    display: grid;
    grid-template-columns: 44px 1fr 44px 1fr;
    gap: 14px;
    align-items: center;
    width: 686px;
    max-width: 686px;
}

/* 圖標懸浮與 Hover 效果 */
.icon-slot {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    cursor: pointer;
    position: relative;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}
.icon-slot img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 0.25s ease, filter 0.25s ease;
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
}
.icon-slot:hover img {
    transform: scale(1.22) rotate(4deg) translateZ(0);
    filter: drop-shadow(0 0 8px rgba(78, 157, 221, 0.85));
}

/* 輸入框 Hover & Focus 效果 */
.input-slot {
    background: #08060c;
    border: 1px solid #3a3f47;
    border-radius: 6px;
    padding: 0 10px;
    height: 38px;
    width: 100%;
    color: #ffffff;
    font-family: "Chela One", cursive;
    font-size: 20px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.25s ease;
    min-width: 0;
}
.input-slot:hover {
    border-color: #8c929a;
    background: #0c121c;
    box-shadow: 0 0 8px rgba(78, 157, 221, 0.25);
}
.input-slot:focus {
    outline: none;
    border-color: #4ed3ed;
    box-shadow: 0 0 12px rgba(78, 157, 221, 0.6);
    background: #101c24;
    transform: scale(1.02);
}

.header-info-bar .input-slot {
    height: 36px;
    width: 80px;
    background: #08060c;
    border: 1px solid #8c929a;
    border-radius: 6px;
    padding: 0 10px;
    color: #ffffff;
    font-size: 22px;
    text-align: center;
    justify-content: center;
}
.header-info-bar .input-slot.narrow { width: 40px !important; }
.header-info-bar .input-slot.spot-wide { width: 110px !important; }
.header-info-bar .input-slot:hover {
    border-color: #4ed3ed;
    box-shadow: 0 0 8px rgba(78, 157, 221, 0.4);
}
.header-info-bar .input-slot:focus {
    border-color: #4ed3ed;
    box-shadow: 0 0 14px rgba(78, 157, 221, 0.7);
    transform: scale(1.06);
}

/* Bottom Bar */
.bottom-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    background: #030305;
    padding: 16px 0;
    border-radius: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    border: 1px solid #1a1c20;
}
.bottom-bar button:not(.btn-close) {
    border: none;
    font-size: 18px;
    width: 120px;
    height: 52px;
    border-radius: 14px;
    cursor: pointer;
    font-family: "Chela One", cursive;
    letter-spacing: 1px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.bottom-bar button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 15px rgba(78, 157, 221, 0.4);
}
.bottom-bar button:active { transform: translateY(1px); }

.btn-reset { background: #8c929a; color: #16181a; }
.btn-copy { background: #a0a6b0; color: #16181a; }
.btn-save { background: #4ed3ed; color: #000000; font-weight: bold; }
.btn-add-bot { background: #16181a; color: #7ddcff; border: 1px solid #4ed3ed !important; }

.btn-close {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: #5b6068;
    color: #fff;
    font-weight: bold;
    font-size: 24px;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
}
.btn-close:hover { background: #e04a4a; transform: translateY(-3px) rotate(90deg); box-shadow: 0 0 12px rgba(224, 74, 74, 0.6); }

/* Modal */
#icon-modal, #confirm-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
}
.modal-content {
    background: radial-gradient(circle at 50% 15%, #150f20 0%, #020204 85%);
    border: 2px solid #4ed3ed;
    border-radius: 16px;
    padding: 25px;
    width: 900px;
    max-width: 95vw; 
    max-height: 92vh;
    display: flex; 
    flex-direction: column;
    box-shadow: 0 0 25px rgba(78, 157, 221, 0.3);
    animation: modalPopup 0.2s ease-out;
}
.confirm-content {
    background: radial-gradient(circle at 50% 15%, #0f1820 0%, #020204 85%);
    border: 2px solid #4ed3ed;
    border-radius: 16px;
    padding: 25px;
    width: 350px; max-width: 90vw;
    text-align: center;
    box-shadow: 0 0 25px rgba(78, 157, 221, 0.4);
    animation: modalPopup 0.25s ease-out;
}
.confirm-title { font-size: 26px; color: #7ddcff; margin-bottom: 20px; text-shadow: 0 0 8px rgba(78, 157, 221, 0.5); }
.confirm-buttons { display: flex; gap: 12px; justify-content: center; }
.confirm-buttons button {
    border: none; font-size: 18px; width: 100px; height: 44px; border-radius: 12px; cursor: pointer;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.confirm-btn-yes { background: #4ed3ed; color: #000000; font-weight: bold; }
.confirm-btn-no { background: #8c929a; color: #16181a; }

@keyframes modalPopup {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes floatTitle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
@keyframes neonPulseHeader {
    0% { text-shadow: 0 0 8px rgba(78, 157, 221, 0.4); }
    100% { text-shadow: 0 0 20px rgba(78, 157, 221, 0.9), 0 0 30px rgba(170, 224, 255, 0.6); }
}

.modal-header {
    font-size: 26px; color: #7ddcff; margin-bottom: 12px; text-align: center;
    letter-spacing: 2px; text-shadow: 0 0 8px rgba(78, 157, 221, 0.5);
    border-bottom: 1px solid rgba(78, 157, 221, 0.3); padding-bottom: 8px;
}
.modal-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
.tab-btn {
    background: #08060c; border: 1px solid #3a3f47; color: #dcd6cd; font-size: 22px;
    padding: 8px 18px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.tab-btn:hover { border-color: #4ed3ed; color: #aae0ff; transform: translateY(-2px); }
.tab-btn.active { background: #4ed3ed; border-color: #aae0ff; color: #000000; font-weight: bold; box-shadow: 0 0 10px rgba(78, 157, 221, 0.5); }

.icon-grid {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 16px;
    overflow-y: auto;
    padding: 6px;
    max-height: 580px;
    margin-bottom: 16px;
    align-items: center;
}
.icon-grid::-webkit-scrollbar { width: 6px; }
.icon-grid::-webkit-scrollbar-track { background: #08060c; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb { background: #8c929a; border-radius: 4px; }
.icon-grid::-webkit-scrollbar-thumb:hover { background: #4ed3ed; }

.icon-option {
    width: 100%; aspect-ratio: 1 / 1;
    background: transparent;
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    transform: translateZ(0);
    backface-visibility: hidden;
    will-change: transform;
}
.icon-option:hover {
    transform: scale(1.22) rotate(4deg) translateZ(0);
}
.icon-option img {
    width: 90%; height: 90%;
    object-fit: contain;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}
.icon-option:hover img {
    filter: drop-shadow(0 0 8px rgba(78, 157, 221, 0.8));
}
.modal-close-btn {
    background: #8c929a; color: #16181a; border: none; padding: 10px; border-radius: 10px;
    font-size: 18px; cursor: pointer; font-family: "Chela One", cursive; transition: all 0.2s ease;
}
.modal-close-btn:hover { background: #4ed3ed; color: #000000; transform: translateY(-2px); }

@media (max-width: 1350px) {
    .two-panel { grid-template-columns: 1fr; justify-items: center; }
    .right-column, .panel, .panel.sps-panel, .extra-bottom-row { width: 100%; max-width: 686px; }
}
@media (max-width: 720px) { 
    .header-info-bar { flex-wrap: wrap; } 
    body { padding: 10px 5px; } 
    body::before { animation: none; } /* 行動裝置關閉背景脈衝動畫以節省效能 */
}
</style>
</head>

// --- 星空與流暢高效能彗星拖尾特效 Canvas ---
const canvas = document.getElementById('gear-canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initDreamyStars();
    }, 150);
});

let dreamStars = [];
function initDreamyStars() {
    dreamStars = [];
    const count = Math.min(100, Math.floor((width * height) / 9000));
    for (let i = 0; i < count; i++) {
        dreamStars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2.2 + 0.8,
            alpha: Math.random() * 0.7 + 0.2,
            pulseSpeed: Math.random() * 0.03 + 0.005,
            vx: (Math.random() - 0.5) * 0.1,
            vy: (Math.random() - 0.5) * 0.1,
            isSparkle: Math.random() > 0.8
        });
    }
}
initDreamyStars();

let mouseX = width / 2;
let mouseY = height / 2;
let targetX = width / 2;
let targetY = height / 2;

const historyPoints = [];
const maxHistoryLength = 28;

window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
});

function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

let isPageVisible = true;
document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) {
        lastTime = performance.now();
        requestAnimationFrame(animateDreamEffect);
    }
});

let lastTime = performance.now();
const fpsInterval = 1000 / 60;

function animateDreamEffect(currentTime) {
    if (!isPageVisible) return;

    requestAnimationFrame(animateDreamEffect);

    const elapsed = currentTime - lastTime;
    if (elapsed < fpsInterval) return;
    lastTime = currentTime - (elapsed % fpsInterval);

    ctx.clearRect(0, 0, width, height);

    mouseX += (targetX - mouseX) * 0.08;
    mouseY += (targetY - mouseY) * 0.08;

    historyPoints.push({ x: mouseX, y: mouseY });
    if (historyPoints.length > maxHistoryLength) {
        historyPoints.shift();
    }

    dreamStars.forEach(star => {
        star.x += star.vx;
        star.y += star.vy;
        if (star.x < 0) star.x = width;
        if (star.x > width) star.x = 0;
        if (star.y < 0) star.y = height;
        if (star.y > height) star.y = 0;

        star.alpha += Math.sin(Date.now() * star.pulseSpeed) * 0.008;
        let currentAlpha = Math.max(0.1, Math.min(0.9, star.alpha));

        if (star.isSparkle) {
            drawStar(star.x, star.y, 4, star.size * 1.5, star.size * 0.5, '#aae0ff', currentAlpha);
        } else {
            ctx.fillStyle = `rgba(170, 224, 255, ${currentAlpha})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    if (historyPoints.length > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        for (let i = 1; i < historyPoints.length; i++) {
            let p1 = historyPoints[i - 1];
            let p2 = historyPoints[i];
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
        }
        ctx.strokeStyle = 'rgba(78, 157, 221, 0.4)';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(mouseX, mouseY, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- 結構化儲存與還原 ---
function autoSaveData() {
    const data = {
        header: {},
        sps: {},
        psps: {},
        customPsps: [],
        extra: []
    };
    
    document.querySelectorAll('.header-info-bar input').forEach(input => {
        data.header[input.dataset.id] = input.value;
    });

    document.querySelectorAll('.sps-panel .row-sp').forEach(row => {
        const rowId = row.dataset.rowId;
        const inputs = Array.from(row.querySelectorAll('input')).map(i => i.value);
        const icons = Array.from(row.querySelectorAll('.icon-slot img')).map(img => img.getAttribute('src'));
        data.sps[rowId] = { inputs, icons };
    });

    document.querySelectorAll('#psps-panel .row-ps').forEach(row => {
        const rowId = row.dataset.rowId;
        const inputs = Array.from(row.querySelectorAll('input')).map(i => i.value);
        const icons = Array.from(row.querySelectorAll('.icon-slot img')).map(img => img.getAttribute('src'));
        
        if (row.classList.contains('custom-added')) {
            data.customPsps.push({ rowId, inputs, icons });
        } else if (rowId) {
            data.psps[rowId] = { inputs, icons };
        }
    });

    document.querySelectorAll('.extra-bottom-row input').forEach(input => {
        data.extra.push(input.value);
    });

    localStorage.setItem('yertirand_planner_data_v5', JSON.stringify(data));
}

function loadSavedData() {
    const saved = localStorage.getItem('yertirand_planner_data_v5');
    if (!saved) return;
    try {
        const data = JSON.parse(saved);
        
        if (data.header) {
            for (const [id, val] of Object.entries(data.header)) {
                const input = document.querySelector(`.header-info-bar input[data-id="${id}"]`);
                if (input) { 
                    input.value = val; 
                    input.setAttribute('value', val);
                }
            }
        }

        if (data.sps) {
            for (const [rowId, item] of Object.entries(data.sps)) {
                const row = document.querySelector(`.sps-panel .row-sp[data-row-id="${rowId}"]`);
                if (row) {
                    const inputs = row.querySelectorAll('input');
                    item.inputs.forEach((val, i) => { 
                        if (inputs[i]) { 
                            inputs[i].value = val; 
                            inputs[i].setAttribute('value', val);
                        } 
                    });
                    const imgs = row.querySelectorAll('.icon-slot img');
                    item.icons.forEach((src, i) => { if (imgs[i]) { imgs[i].src = src; } });
                }
            }
        }

        if (data.psps) {
            for (const [rowId, item] of Object.entries(data.psps)) {
                const row = document.querySelector(`#psps-panel .row-ps[data-row-id="${rowId}"]`);
                if (row) {
                    const inputs = row.querySelectorAll('input');
                    item.inputs.forEach((val, i) => { 
                        if (inputs[i]) { 
                            inputs[i].value = val; 
                            inputs[i].setAttribute('value', val);
                        } 
                    });
                    const imgs = row.querySelectorAll('.icon-slot img');
                    item.icons.forEach((src, i) => { if (imgs[i]) { imgs[i].src = src; } });
                }
            }
        }

        // 修正：還原自訂行時保留 rowId 屬性，避免儲存時遺失
        if (data.customPsps && data.customPsps.length > 0) {
            const pspsPanelInner = document.querySelector('#psps-panel .panel-inner');
            document.querySelectorAll('#psps-panel .row-ps.custom-added').forEach(r => r.remove());

            data.customPsps.forEach(item => {
                const newRow = document.createElement('div');
                newRow.className = 'row-ps jinn-row custom-added';
                newRow.dataset.rowId = item.rowId || ('custom_' + Math.random().toString(36).substr(2, 9));
                
                let inputsHTML = item.inputs.map(val => `<input class="input-slot" value="${val}" attr-val="${val}">`).join('');
                let iconsHTML = item.icons.map(src => `<div class="icon-slot"><img src="${src}" alt="" data-default="./IMG/PSP/Primary.png"></div>`).join('');
                newRow.innerHTML = `<div class="icon-wrap">${iconsHTML}</div>${inputsHTML}`;
                
                newRow.querySelectorAll('input').forEach((input, idx) => {
                    const val = item.inputs[idx] || '';
                    input.value = val;
                    input.setAttribute('value', val);
                });

                pspsPanelInner.appendChild(newRow);
            });
        }

        if (data.extra) {
            const extraInputs = document.querySelectorAll('.extra-bottom-row input');
            data.extra.forEach((val, idx) => {
                if (extraInputs[idx]) { 
                    extraInputs[idx].value = val; 
                    extraInputs[idx].setAttribute('value', val);
                }
            });
        }
    } catch (e) {
        console.error("Load saved data failed:", e);
    }
}

                clonedDoc.querySelectorAll('.row-ps, .row-sp').forEach(row => {
                    const inputs = Array.from(row.querySelectorAll('input'));
                    const allInputsEmpty = inputs.length > 0 && inputs.every(input => input.value.trim() === '');
                    
                    const icons = Array.from(row.querySelectorAll('.icon-slot img'));
                    const allIconsDefault = icons.every(img => {
                        const currentSrc = img.getAttribute('src');
                        const defaultSrc = img.getAttribute('data-default');
                        if (!defaultSrc) return true;
                        try {
                            const currentPath = new URL(currentSrc, window.location.href).pathname;
                            const defaultPath = new URL(defaultSrc, window.location.href).pathname;
                            return currentPath === defaultPath;
                        } catch (e) {
                            return currentSrc.endsWith(defaultSrc.replace('./', '')) || currentSrc === defaultSrc;
                        }
                    });

                    if (allInputsEmpty && allIconsDefault) {
                        row.style.display = 'none';
                    }
                });

                clonedDoc.querySelectorAll('input').forEach(input => {
                    if (input.closest && input.closest('.header-info-bar')) {
                        const div = clonedDoc.createElement('div');
                        div.className = input.className;
                        div.innerText = input.value;
                        div.style.cssText = input.style.cssText;
                        div.style.display = 'flex'; div.style.alignItems = 'center';
                        div.style.backgroundColor = 'transparent'; div.style.border = 'none'; div.style.boxShadow = 'none';
                        div.style.color = '#ffffff';
                        div.style.fontSize = input.classList.contains('spot-wide') ? '24px' : '26px';
                        div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                        if (input.parentNode) input.parentNode.replaceChild(div, input);
                        return;
                    }

                    const computedStyle = clonedDoc.defaultView.getComputedStyle(input);
                    if (computedStyle.display === 'none' || computedStyle.visibility === 'hidden') return;
                    if (!input.value || input.value.trim() === "") { input.style.visibility = 'hidden'; return; }

                    const div = clonedDoc.createElement('div');
                    div.className = input.className;
                    div.innerText = input.value;
                    div.style.cssText = input.style.cssText;
                    div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.overflow = 'hidden';
                    div.style.whiteSpace = 'nowrap'; div.style.textOverflow = 'ellipsis'; div.style.minWidth = '0';
                    
                    div.style.backgroundColor = '#08060c';
                    div.style.border = '1px solid #3a3f47';
                    div.style.borderRadius = '6px';
                    div.style.padding = '0 8px';
                    div.style.color = '#ffffff';
                    div.style.fontSize = '20px';

                    div.style.justifyContent = (input.classList.contains('narrow') || input.classList.contains('spot-wide') || input.dataset.id === 'time') ? 'center' : 'flex-start';
                    if (input.parentNode) input.parentNode.replaceChild(div, input);
                });
            }
        });
        const blob = await new Promise(resolve => canvasShot.toBlob(resolve, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        copyBtn.innerText = "Copied!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } catch (err) {
        copyBtn.innerText = "Failed!";
        setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
    } finally {
        copyBtn.disabled = false;
    }
});
</script>
</body>
</html>
